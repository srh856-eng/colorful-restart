<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Live Hunt Engine</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0a0f1d; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #141c2f; border: 1px solid #1e293b; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #38bdf8; margin-top: 0; letter-spacing: 1px; text-transform: uppercase; }
        .box { background: #1e293b; border-left: 4px solid #38bdf8; padding: 15px; border-radius: 4px; text-align: left; margin: 20px 0; font-style: italic; font-size: 1.05rem; line-height: 1.5; }
        input { width: 100%; padding: 12px; background: #0a0f1d; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 15px; box-sizing: border-box; text-transform: uppercase; }
        input:focus { border-color: #38bdf8; outline: none; }
        button { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 6px; color: #0a0f1d; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        .status-banner { margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: bold; display: none; }
        .success { background: #065f46; color: #34d399; border: 1px solid #047857; }
        .error { background: #991b1b; color: #fca5a5; border: 1px solid #b91c1c; }
        .stats { display: flex; justify-content: space-between; font-size: 0.9rem; color: #94a3b8; margin-top: 20px; border-top: 1px solid #1e293b; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Jotun Hunt Engine</h2>
    <div id="clue-box" class="box">Establishing connection with secure node deployment...</div>
    
    <div id="game-controls">
        <input type="text" id="answer-input" placeholder="ENTER CLUE PASSWORD HERE" autocomplete="off">
        <button id="submit-btn" onclick="submitAnswer()">SUBMIT ANSWER</button>
    </div>

    <div id="banner" class="status-banner"></div>

    <div class="stats">
        <div>STAGE: <span id="stage-lbl" style="color: #38bdf8; font-weight: bold;">0</span>/5</div>
        <div>STRIKES: <span id="strikes-lbl" style="color: #f87171; font-weight: bold;">0</span>/5</div>
    </div>
</div>

<script>
    const API_URL = "https://us-central1-jotunhunt2026.cloudfunctions.net/checkAnswer";
    
    // Get team identity from URL path parameters
    const urlParams = new URLSearchParams(window.location.search);
    const teamId = urlParams.get('team');

    async function loadCurrentStatus() {
        if (!teamId) {
            document.getElementById('clue-box').innerText = "Access Denied: Missing team verification parameters.";
            document.getElementById('game-controls').style.display = 'none';
            return;
        }

        try {
            const response = await fetch(`${API_URL}?team=${teamId}&action=getClue`);
            const data = await response.json();

            if (data.status === "ELIMINATED") {
                showState("ELIMINATED! Your team reached 5 strikes.", true);
            } else if (data.status === "VICTORY") {
                showState("VICTORY! You have completed the hunt!", false);
            } else {
                document.getElementById('clue-box').innerText = data.hint;
                document.getElementById('stage-lbl').innerText = data.stage;
                document.getElementById('strikes-lbl').innerText = data.strikes;
            }
        } catch (err) {
            document.getElementById('clue-box').innerText = "Offline: Syncing with active secure backend engine node...";
        }
    }

    async function submitAnswer() {
        const inputField = document.getElementById('answer-input');
        const btn = document.getElementById('submit-btn');
        const banner = document.getElementById('banner');
        const answerVal = inputField.value.trim();

        if (!answerVal) return;

        btn.disabled = true;
        btn.innerText = "VALIDATING...";
        banner.style.display = 'none';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ team: teamId, answer: answerVal })
            });
            
            const data = await response.json();

            if (data.success) {
                banner.className = "status-banner success";
                banner.innerText = "✓ Access Granted! Processing next stage matrix...";
                banner.style.display = "block";
                inputField.value = "";
                
                setTimeout(() => {
                    if (data.stage >= 5) {
                        showState("VICTORY! You have completed the hunt!", false);
                    } else {
                        document.getElementById('clue-box').innerText = data.hint;
                        document.getElementById('stage-lbl').innerText = data.stage;
                        document.getElementById('strikes-lbl').innerText = data.strikes;
                        banner.style.display = 'none';
                    }
                    btn.disabled = false;
                    btn.innerText = "SUBMIT ANSWER";
                }, 2000);

            } else {
                banner.className = "status-banner error";
                banner.innerText = data.message === "ELIMINATED" ? "✗ Team Eliminated" : "✗ Answer Incorrect. Strike Registered.";
                banner.style.display = "block";
                
                document.getElementById('stage-lbl').innerText = data.stage || document.getElementById('stage-lbl').innerText;
                document.getElementById('strikes-lbl').innerText = data.strikes || document.getElementById('strikes-lbl').innerText;

                if (data.message === "ELIMINATED" || data.strikes >= 5) {
                    setTimeout(() => showState("ELIMINATED! Your team reached 5 strikes.", true), 2000);
                } else {
                    btn.disabled = false;
                    btn.innerText = "SUBMIT ANSWER";
                }
            }
        } catch (err) {
            banner.className = "status-banner error";
            banner.innerText = "Network transmission error. Retry connection.";
            banner.style.display = "block";
            btn.disabled = false;
            btn.innerText = "SUBMIT ANSWER";
        }
    }

    function showState(msg, isEliminated) {
        document.getElementById('clue-box').innerText = msg;
        document.getElementById('game-controls').style.display = 'none';
        const banner = document.getElementById('banner');
        banner.className = isEliminated ? "status-banner error" : "status-banner success";
        banner.innerText = isEliminated ? "GAME OVER" : "HUNT COMPLETED";
        banner.style.display = "block";
    }

    // Initialize layout setup on page launch
    loadCurrentStatus();
</script>
</body>
</html>
