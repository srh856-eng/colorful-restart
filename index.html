<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Hunt 2026</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --jotun-navy: #002D72;
            --jotun-navy-deep: #001A45;
            --jotun-navy-mid: #00408A;
            --jotun-red: #C8102E;
            --jotun-red-light: #E8192F;
            --jotun-gold: #F0A500;
            --jotun-white: #FFFFFF;
            --surface: #F6F8FC;
            --surface-2: #EEF2F9;
            --text-primary: #0D1B35;
            --text-secondary: #4A5778;
            --border: #D4DCF0;
            --radius: 10px;
            --shadow: 0 4px 24px rgba(0,45,114,0.10);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--surface);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        header {
            display: none;
            background: var(--jotun-navy);
            padding: 0 24px;
            height: 64px;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .jotun-logomark {
            width: 36px;
            height: 36px;
            background: var(--jotun-red);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: white;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .header-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 17px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.5px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .progress-pill {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .vault-container {
            display: flex;
            gap: 4px;
        }
        .vault-slot {
            width: 28px;
            height: 30px;
            border: 1.5px dashed rgba(255,255,255,0.25);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: transparent;
            background: rgba(0,0,0,0.2);
            transition: all 0.25s ease;
        }
        .vault-slot.filled {
            border-color: var(--jotun-gold);
            background: rgba(240,165,0,0.15);
            color: var(--jotun-gold);
            animation: vaultPop 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }
        @keyframes vaultPop {
            0%   { transform: scale(0.3) rotate(-25deg) translateY(-14px); opacity: 0; box-shadow: 0 0 0 rgba(240,165,0,0); }
            45%  { transform: scale(1.35) rotate(10deg) translateY(2px); opacity: 1; box-shadow: 0 0 18px rgba(240,165,0,0.8); }
            65%  { transform: scale(0.92) rotate(-4deg) translateY(0); box-shadow: 0 0 10px rgba(240,165,0,0.5); }
            85%  { transform: scale(1.08) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; box-shadow: 0 0 4px rgba(240,165,0,0.25); }
        }

        /* ── MAIN CARD ── */
        .game-wrap {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 16px 48px;
        }
        .main-card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .card-header-band {
            background: var(--jotun-navy);
            padding: 20px 24px 18px;
            position: relative;
            overflow: hidden;
        }
        .card-header-band::after {
            content: '';
            position: absolute;
            right: -20px;
            top: -20px;
            width: 100px;
            height: 100px;
            background: var(--jotun-red);
            opacity: 0.15;
            border-radius: 50%;
        }
        .stage-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 6px;
        }
        .card-heading {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: white;
            line-height: 1.1;
        }
        .card-body {
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .desc-text {
            font-size: 14px;
            line-height: 1.65;
            color: var(--text-secondary);
        }
        .prompt-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--jotun-navy);
            letter-spacing: 0.2px;
        }
        .input-box {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: var(--surface);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-box:focus {
            border-color: var(--jotun-navy);
            box-shadow: 0 0 0 3px rgba(0,45,114,0.08);
            background: white;
        }
        .btn {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: var(--jotun-navy);
            color: white;
        }
        .btn-primary:hover { background: var(--jotun-navy-mid); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-accent {
            background: var(--jotun-red);
            color: white;
        }
        .btn-accent:hover { background: var(--jotun-red-light); transform: translateY(-1px); }
        .btn-ghost {
            background: var(--surface-2);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--surface); color: var(--text-primary); }
        .btn-ghost:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ── CROSSWORD CLUES ── */
        .cw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .cw-col-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .cw-clue-btn {
            width: 100%;
            text-align: left;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 8px 10px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            cursor: pointer;
            margin-bottom: 5px;
            transition: all 0.15s;
        }
        .cw-clue-btn:hover { background: var(--jotun-navy); color: white; border-color: var(--jotun-navy); }

        .divider { height: 1px; background: var(--border); margin: 2px 0; }

        /* ── ERROR STATE ── */
        .error-state {
            text-align: center;
            padding: 40px 24px;
        }
        .error-icon {
            width: 56px;
            height: 56px;
            background: rgba(200,16,46,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .error-icon svg { color: var(--jotun-red); }
        .error-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .error-msg { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

        /* ── LOADING STATE ── */
        .loading-state {
            text-align: center;
            padding: 52px 24px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--jotun-navy);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-label { font-size: 13px; color: var(--text-secondary); }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,20,50,0.55);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-box {
            background: white;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.25s ease;
        }
        .modal-box.wide { max-width: 520px; }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            background: var(--jotun-navy);
            padding: 16px 20px;
        }
        .modal-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: white;
        }
        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .hint-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
            background: var(--surface);
            border-left: 3px solid var(--jotun-gold);
            padding: 12px 14px;
            border-radius: 0 8px 8px 0;
        }

        /* ── SPLASH ── */
        .splash-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--jotun-navy);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .splash-text {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            animation: splashPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .splash-bar {
            width: 60px;
            height: 4px;
            background: var(--jotun-red);
            border-radius: 2px;
            margin-top: 16px;
            animation: barGrow 0.4s ease 0.3s both;
        }
        @keyframes splashPop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes barGrow {
            from { width: 0; }
            to { width: 60px; }
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            z-index: 3000;
            transition: transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--jotun-red); }

        /* ── FOOTER BRAND ── */
        .footer-brand {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #B0BCDA;
            letter-spacing: 0.5px;
        }

        /* ── GAME OVER FREEZE OVERLAY ── */
        .freeze-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 10, 30, 0.88);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 4000;
            flex-direction: column;
            gap: 16px;
            padding: 32px;
        }
        .freeze-overlay.active { display: flex; }
        .freeze-icon {
            font-size: 48px;
            animation: freezePop 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .freeze-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: white;
            text-align: center;
            letter-spacing: 1px;
            animation: freezePop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) 0.1s both;
        }
        .freeze-subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            text-align: center;
            max-width: 320px;
            line-height: 1.6;
            animation: freezePop 0.5s ease 0.25s both;
        }
        @keyframes freezePop {
            from { transform: scale(0.8) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* ── VICTORY OVERLAY ── */
        .victory-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--jotun-navy-deep);
            align-items: center;
            justify-content: center;
            z-index: 4000;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }
        .victory-overlay.active { display: flex; }
        .victory-confetti-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .victory-content {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 32px;
        }
        .victory-trophy {
            font-size: 72px;
            animation: trophyBounce 0.8s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        @keyframes trophyBounce {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .victory-headline {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 56px;
            font-weight: 800;
            color: var(--jotun-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(240,165,0,0.5);
            animation: victoryFadeIn 0.6s ease 0.3s both;
        }
        .victory-team {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
            animation: victoryFadeIn 0.6s ease 0.5s both;
        }
        .victory-instruct {
            font-size: 14px;
            color: rgba(255,255,255,0.55);
            margin-top: 8px;
            animation: victoryFadeIn 0.6s ease 0.7s both;
        }
        @keyframes victoryFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── FINALE TREASURE ROOM ── */
        .finale-card {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% -18%, rgba(255, 207, 89, 0.34), transparent 34%),
                radial-gradient(circle at 8% 20%, rgba(200, 16, 46, 0.22), transparent 30%),
                radial-gradient(circle at 92% 18%, rgba(0, 45, 114, 0.35), transparent 34%),
                linear-gradient(160deg, #2a1404 0%, #080b12 48%, #14101b 100%);
            border: 1.5px solid rgba(255, 202, 72, 0.58);
            box-shadow: 0 24px 80px rgba(80, 40, 0, 0.38), inset 0 0 50px rgba(255, 174, 26, 0.10);
        }
        .finale-card::before {
            content: '';
            position: absolute;
            inset: -40%;
            z-index: 0;
            background:
                radial-gradient(circle, rgba(255, 218, 107, 0.22) 0 2px, transparent 3px),
                radial-gradient(circle, rgba(255, 255, 255, 0.12) 0 1px, transparent 2px);
            background-size: 70px 70px, 44px 44px;
            animation: treasureDust 18s linear infinite;
            opacity: 0.42;
            pointer-events: none;
        }
        .finale-card::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,215,96,0.10), rgba(255,255,255,0.02));
            transform: translateX(-120%);
            animation: treasureSweep 5.5s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes treasureDust {
            from { transform: translate3d(0,0,0) rotate(0deg); }
            to { transform: translate3d(30px,40px,0) rotate(18deg); }
        }
        @keyframes treasureSweep {
            0%, 45% { transform: translateX(-120%); opacity: 0; }
            55% { opacity: 0.8; }
            72%, 100% { transform: translateX(120%); opacity: 0; }
        }
        .finale-cipher-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            opacity: 0.10;
            font-family: 'Barlow Condensed', monospace;
            font-size: 9px;
            font-weight: 700;
            color: #ffd86b;
            letter-spacing: 2px;
            line-height: 1.4;
            padding: 8px;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: 0 0 10px rgba(255, 204, 80, 0.55);
        }
        .finale-header-band {
            background:
                radial-gradient(circle at 12% 0%, rgba(255, 223, 118, 0.36), transparent 30%),
                linear-gradient(135deg, #3a1d07 0%, #8b5a12 42%, #1a0f08 100%);
            padding: 22px 24px 20px;
            position: relative;
            z-index: 1;
            border-bottom: 1.5px solid rgba(255, 220, 98, 0.62);
            box-shadow: inset 0 -18px 40px rgba(0,0,0,0.24);
        }
        .finale-eyebrow {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff2b8;
            margin-bottom: 7px;
            text-shadow: 0 0 16px rgba(255, 215, 90, 0.6);
        }
        .finale-heading {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 34px;
            font-weight: 800;
            color: #fff8dc;
            line-height: 1.05;
            letter-spacing: 0.6px;
            text-shadow: 0 3px 0 rgba(84, 43, 0, 0.5), 0 0 28px rgba(255, 198, 54, 0.55);
        }
        .finale-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 1;
            background: linear-gradient(180deg, rgba(0,0,0,0.10), rgba(0,0,0,0.24));
        }
        .finale-desc {
            font-size: 14.5px;
            line-height: 1.75;
            color: #fff0bf;
            text-shadow: 0 1px 8px rgba(0,0,0,0.55);
        }
        .finale-key-phrase {
            font-size: 18px;
            font-weight: 800;
            color: #ffe58a;
            letter-spacing: 0.6px;
            text-align: center;
            padding: 10px 12px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(255, 209, 82, 0.18), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 214, 84, 0.32);
            text-shadow: 0 0 18px rgba(255, 205, 67, 0.5);
        }
        .finale-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 217, 97, 0.65), transparent);
            margin: 2px 0;
        }

        /* ── LETTER PILE ANIMATION ── */
        .letter-pile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            padding: 12px 0 6px;
            position: relative;
        }
        .letter-tile {
            width: 36px;
            height: 42px;
            border: 1.8px solid rgba(255, 225, 109, 0.86);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 21px;
            color: #2a1604;
            background: linear-gradient(145deg, #fff3b3 0%, #ffc340 42%, #b36b0d 100%);
            opacity: 0;
            transform: translate(140px, -90px) rotate(60deg) scale(0.4);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.55), 0 10px 24px rgba(255, 179, 22, 0.30);
        }
        .letter-tile.drop {
            animation: letterFlyIn 0.65s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        @keyframes letterFlyIn {
            0%   { opacity: 0; transform: translate(140px, -90px) rotate(60deg) scale(0.4); box-shadow: 0 0 0 rgba(240,165,0,0); }
            55%  { opacity: 1; transform: translate(-6px, 6px) rotate(-8deg) scale(1.15); box-shadow: 0 0 22px rgba(255, 213, 86, 0.95); }
            75%  { transform: translate(2px, -2px) rotate(4deg) scale(0.95); }
            100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); box-shadow: inset 0 2px 0 rgba(255,255,255,0.55), 0 10px 24px rgba(255, 179, 22, 0.30); }
        }

        /* ── FINALE INPUT THEME ── */
        .finale-input {
            background: rgba(255, 246, 210, 0.96) !important;
            border-color: rgba(255, 206, 65, 0.88) !important;
            color: #1b1207 !important;
            font-weight: 800;
            box-shadow: 0 0 0 3px rgba(255, 205, 69, 0.10), inset 0 2px 0 rgba(255,255,255,0.55);
        }

        const teamToken = urlParams.get('id');

        let localStateCache = null;

        // ── API HELPER ──

            const response = await fetch(`${CLOUD_FUNCTIONS_BASE_URL}/${endpointName}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ data: payload })
            });
            const json = await response.json();
            if (!response.ok || json.error) {
                throw new Error(json.error?.message || "Something went wrong. Please try again.");
            }
            return json.result;
        }

            setLoading();
            try {
                const data = await callCloudEndpoint('getGameState', { token: teamToken });

                    if (data.thisTeamWon) {
                        showVictory(data.teamName);
                    } else {
                        showFreeze(data.winnerName);

                    return;

                renderUI(data);

        function formatPenalty(seconds) {
            const s = Math.max(0, Number(seconds) || 0);
            return `00:${String(s).padStart(2, '0')}`;
        }

        function startPenaltyCountdown(seconds) {
            penaltyRemaining = Math.max(0, Number(seconds) || 0);
            clearInterval(penaltyTimer);
            const panel = document.getElementById('penalty-panel');
            const count = document.getElementById('penalty-count');
            const submit = document.getElementById('answer-submit-btn');

            function paint() {
                const hasPenalty = penaltyRemaining > 0;
                if (panel) panel.classList.toggle('active', hasPenalty);
                if (count) count.innerText = formatPenalty(penaltyRemaining);
                if (submit) submit.disabled = hasPenalty;
                if (submit) submit.style.opacity = hasPenalty ? '0.55' : '1';
            }

            paint();
            if (penaltyRemaining > 0) {
                penaltyTimer = setInterval(() => {
                    penaltyRemaining -= 1;
                    paint();
                    if (penaltyRemaining <= 0) clearInterval(penaltyTimer);
                }, 1000);
            }
        }

        function handlePenaltyResponse(res, fallbackMessage) {
            const seconds = res.penaltyRemainingSeconds || 30;
            startPenaltyCountdown(seconds);
            const viewport = document.getElementById('game-viewport');
            if (viewport) {
                viewport.classList.remove('shake-wrong');
                void viewport.offsetWidth;
                viewport.classList.add('shake-wrong');
            }
            showToast(fallbackMessage || `Wrong answer. 30 second penalty applied.`, true);
        }

   async function triggerHintRequest() {
    const btn = document.getElementById('hint-btn-anchor');
    if (btn && btn.disabled) return;

    // 1. Check if hints are exhausted locally first
    if (localStateCache && localStateCache.hintsUsed >= 2) {
        showToast("No hints remaining!", true);
        if (btn) {
            btn.innerText = "No hints remaining";
            btn.disabled = true;
        }
        return;
    }

    // 2. ACCIDENTAL CLICK GUARD: Confirms for ALL puzzles
    if (!confirm("Are you sure you want to request a hint? Balance will deduct.")) {
        return; // Stops completely if they click "Cancel"
    }

    const currentScreen = localStateCache ? localStateCache.viewType : '';

    // 3. Clean routing after they confirm
    if (currentScreen === "CW") {
        // ONLY the Crossword opens the sub-menu buttons
        OpenCrosswordHintSelectionPopup();
    } else {
        // Lockbox (MR), Blueprint (BP), and all others get text immediately
        executeHintFetchFromServer(null);
    }
}

// This helper function talks directly to your backend server
async function executeHintFetchFromServer(selectionParameter) {
    try {
        // We explicitly force the data package to hold the clue identity parameter
        const res = await callCloudEndpoint('requestHint', { 
            token: teamToken, 
            crosswordClueId: selectionParameter 
        });
        
        if (res.success) {
            // Close the choice selector popup cleanly
            closeModal('action-modal');
            
            // Show the actual text hint inside your main hint modal box
            document.getElementById('hint-modal-text').innerText = res.hint;
            document.getElementById('hint-modal').style.display = "flex";
            
            localStateCache.hintsUsed = 2 - res.remaining;
            updateHintButtonLabel(localStateCache.hintsUsed);
        } else {
            showToast(res.message || "You've used all your hints.", true);
            updateHintButtonLabel(2);
        }
    } catch (e) {
        showToast(e.message, true);
        if (localStateCache) updateHintButtonLabel(localStateCache.hintsUsed);
    }
}

        // ── VIGENÈRE WHEEL ──
        function openVigenereWheel() {
            const title = document.getElementById('action-modal-title');
            const body = document.getElementById('action-modal-body');
            title.innerText = "Vigenère Cipher Wheel";

            const ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let innerRotation = 0; // degrees
            let keyShift = 0; // 0-25, A=0

            body.innerHTML = `
                <div class="wheel-wrap">
                    <p class="wheel-label">Rotate the inner ring so its <strong>A</strong> lines up with your key letter on the outer ring</p>
                    <div class="wheel-svg-wrap" id="wheel-svg-wrap">

                    </div>

                    </div>
                    <div class="wheel-readout" id="wheel-readout">Key letter: A</div>
                    <div class="finale-divider" style="width:100%;"></div>
                    <p class="wheel-label">Use this key setting to encode or decode a letter</p>
                    <div class="wheel-controls" style="gap:10px; flex-wrap:wrap; justify-content:center;">
                        <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
                            <span class="wheel-label" style="text-transform:none; letter-spacing:0;">Plain letter</span>
                            <input type="text" maxlength="1" id="wheel-plain-input" class="input-box" style="width:60px; text-align:center; text-transform:uppercase;" oninput="wheelEncode()">
                        </div>
                        <div style="font-size:20px; color:var(--text-secondary); padding-top:18px;">→</div>
                        <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
                            <span class="wheel-label" style="text-transform:none; letter-spacing:0;">Cipher letter</span>
                            <input type="text" maxlength="1" id="wheel-cipher-output" class="input-box" style="width:60px; text-align:center;" readonly>
                        </div>
                    </div>
                    <div class="wheel-controls" style="gap:10px; flex-wrap:wrap; justify-content:center;">
                        <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
                            <span class="wheel-label" style="text-transform:none; letter-spacing:0;">Cipher letter</span>
                            <input type="text" maxlength="1" id="wheel-cipher-input" class="input-box" style="width:60px; text-align:center; text-transform:uppercase;" oninput="wheelDecode()">
                        </div>
                        <div style="font-size:20px; color:var(--text-secondary); padding-top:18px;">→</div>
                        <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
                            <span class="wheel-label" style="text-transform:none; letter-spacing:0;">Plain letter</span>
                            <input type="text" maxlength="1" id="wheel-plain-output" class="input-box" style="width:60px; text-align:center;" readonly>
                        </div>
                    </div>
                </div>`;

            const outerSVG = document.getElementById('wheel-outer');
            const innerSVG = document.getElementById('wheel-inner');

            function drawOuter() {
                const cx = 130, cy = 130, r = 118, labelR = 100;
                let html = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#001A45" stroke="#0f3580" stroke-width="2"/>
                            <circle cx="${cx}" cy="${cy}" r="88" fill="none" stroke="#1a3a7a" stroke-width="1" stroke-dasharray="3,3"/>`;
                for (let i = 0; i < 26; i++) {
                    const angle = (i * 360 / 26 - 90) * Math.PI / 180;
                    const lx = cx + labelR * Math.cos(angle);
                    const ly = cy + labelR * Math.sin(angle);
                    html += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central"
                        font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="13"
                        fill="#a8c0e8">${ALPHA[i]}</text>`;
                    // tick mark
                    const ix = cx + 88 * Math.cos(angle);
                    const iy = cy + 88 * Math.sin(angle);
                    const ox2 = cx + 94 * Math.cos(angle);
                    const oy2 = cy + 94 * Math.sin(angle);
                    html += `<line x1="${ix}" y1="${iy}" x2="${ox2}" y2="${oy2}" stroke="#2a4a8a" stroke-width="1.5"/>`;
                }
                // pointer arrow at top
                html += `<polygon points="130,6 125,18 135,18" fill="#F0A500"/>`;
                outerSVG.innerHTML = html;
            }

            function drawInner() {
                const cx = 90, cy = 90, r = 78, labelR = 62;
                let html = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#0d1f45" stroke="#2a4070" stroke-width="2"/>
                            <circle cx="${cx}" cy="${cy}" r="50" fill="#081530" stroke="#1a3060" stroke-width="1"/>`;
                for (let i = 0; i < 26; i++) {
                    const angle = (i * 360 / 26 - 90) * Math.PI / 180;
                    const lx = cx + labelR * Math.cos(angle);
                    const ly = cy + labelR * Math.sin(angle);
                    html += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central"
                        font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="11"
                        fill="#e8dfc0">${ALPHA[i]}</text>`;
                }
                // center label
                html += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
                    font-family="Barlow Condensed, sans-serif" font-size="11" font-weight="600"
                    fill="#4a6090">CIPHER</text>`;
                innerSVG.innerHTML = html;
            }

            function updateReadout() {
                const step = 360 / 26;
                keyShift = ((Math.round(innerRotation / step) % 26) + 26) % 26;
                const keyLetter = ALPHA[keyShift];
                document.getElementById('wheel-readout').textContent = `Key letter: ${keyLetter}`;
                wheelEncode();
                wheelDecode();
            }

            // Vigenère: cipher = (plain + keyShift) mod 26
            window.wheelEncode = function() {
                const inp = document.getElementById('wheel-plain-input');
                const out = document.getElementById('wheel-cipher-output');
                if (!inp || !out) return;
                const ch = (inp.value || "").toUpperCase().replace(/[^A-Z]/g, "");
                inp.value = ch;
                if (!ch) { out.value = ""; return; }
                const plainIdx = ALPHA.indexOf(ch);
                out.value = ALPHA[(plainIdx + keyShift) % 26];
            };

            // Vigenère decode: plain = (cipher - keyShift) mod 26
            window.wheelDecode = function() {
                const inp = document.getElementById('wheel-cipher-input');
                const out = document.getElementById('wheel-plain-output');
                if (!inp || !out) return;
                const ch = (inp.value || "").toUpperCase().replace(/[^A-Z]/g, "");
                inp.value = ch;
                if (!ch) { out.value = ""; return; }
                const cipherIdx = ALPHA.indexOf(ch);
                out.value = ALPHA[((cipherIdx - keyShift) % 26 + 26) % 26];
            };

            window.rotateWheel = function(steps) {
                if (steps === -999) { innerRotation = 0; }
                else { innerRotation += steps * (360 / 26); }
                innerSVG.style.transition = "transform 0.15s ease";
                innerSVG.style.transform = `translate(-50%, -50%) rotate(${innerRotation}deg)`;
                updateReadout();
            };

            // Drag to rotate inner wheel — mouse + touch support
            const wrap = document.getElementById('wheel-svg-wrap');
            let dragging = false, lastAngle = 0;

            function getAngleFromEvent(clientX, clientY) {
                const rect = wrap.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
            }

            function dragStart(clientX, clientY) {
                dragging = true;
                lastAngle = getAngleFromEvent(clientX, clientY);
            }
            function dragMove(clientX, clientY) {
                if (!dragging) return;
                const angle = getAngleFromEvent(clientX, clientY);
                innerRotation += angle - lastAngle;
                lastAngle = angle;
                innerSVG.style.transition = "none";
                innerSVG.style.transform = `translate(-50%, -50%) rotate(${innerRotation}deg)`;
                updateReadout();
            }
            function dragEnd() {
                if (!dragging) return;
                dragging = false;
                const step = 360 / 26;
                innerRotation = Math.round(innerRotation / step) * step;
                innerSVG.style.transition = "transform 0.15s ease";
                innerSVG.style.transform = `translate(-50%, -50%) rotate(${innerRotation}deg)`;
                updateReadout();
            }

            wrap.addEventListener('mousedown', (e) => dragStart(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => dragMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', dragEnd);

            wrap.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                dragStart(t.clientX, t.clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                const t = e.touches[0];
                dragMove(t.clientX, t.clientY);
            }, { passive: true });
            window.addEventListener('touchend', dragEnd);

            drawOuter();
            drawInner();
            updateReadout();

            document.getElementById('action-modal').style.display = "flex";
        }

            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            clearTimeout(toastTimer);
            requestAnimationFrame(() => { t.classList.add('show'); });
            toastTimer = setTimeout(() => { t.classList.remove('show'); }, 3500);
        }

        function updateHintButtonLabel(used, isFinale = false) {
            const btn = document.getElementById('hint-btn-anchor');
            if (!btn) return;
            const remaining = 2 - used;
            if (remaining <= 0) {
                btn.innerText = "No hints remaining";
                btn.disabled = true;
            } else {
                btn.innerText = `Request a Hint (${remaining} remaining)`;
                btn.disabled = false;
            }
        }

        // ── WINNER / FREEZE ──
        function showVictory(teamName) {
            gameFrozen = true;
            document.getElementById('victory-team-name').innerText = teamName;
            document.getElementById('victory-overlay').classList.add('active');
            launchConfetti();
        }

        function showFreeze(winnerName) {
            gameFrozen = true;
            document.getElementById('freeze-title').innerText = `The hunt is over.`;
            document.getElementById('freeze-subtitle').innerText = `${winnerName} has found the treasure first. The game has ended. Well played!`;
            document.getElementById('freeze-overlay').classList.add('active');
        }

        // ── CONFETTI ──
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const COLORS = ['#F0A500','#C8102E','#002D72','#ffffff','#10B981','#a855f7'];
            const pieces = Array.from({ length: 160 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 5 + 3,
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                angle: Math.random() * 360,
                spin: (Math.random() - 0.5) * 4,
                vx: (Math.random() - 0.5) * 3,
                vy: Math.random() * 3 + 1.5
            }));

            const stopTime = Date.now() + 10000;
            let frameId = null;
            function frame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.angle += p.spin;
                    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    ctx.save();
                    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
                    ctx.rotate(p.angle * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });
                if (Date.now() < stopTime) {
                    frameId = requestAnimationFrame(frame);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (frameId) cancelAnimationFrame(frameId);
                }
            }
            frame();
        }
