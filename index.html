<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Interactive Scavenger Hub</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>
    <style>
        :root { --primary: #002D72; --accent: #FFC72C; --dark: #1C2434; --light: #F4F7FC; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--light); color: var(--dark); display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--primary); padding: 15px; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 100; }
        .progress-box { font-weight: bold; background: rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 20px; }
        .vault-container { display: flex; gap: 4px; background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
        .vault-slot { width: 28px; height: 28px; border: 1px dashed rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: var(--accent); background: rgba(0,0,0,0.3); border-radius: 4px; text-transform: uppercase; }
        .vault-slot.filled { border-style: solid; border-color: var(--accent); background: var(--primary); transform: scale(1.1); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .main-card { flex: 1; max-width: 500px; width: 100%; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 15px; }
        h2 { color: var(--primary); font-size: 22px; border-bottom: 2px solid var(--light); padding-bottom: 8px; }
        .desc-text { line-height: 1.5; color: #55637D; font-size: 15px; }
        .input-box { width: 100%; padding: 12px 16px; border: 2px solid #E2E8F0; border-radius: 8px; font-size: 16px; outline: none; transition: 0.2s; text-transform: uppercase; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-submit { background: var(--primary); color: white; }
        .btn-submit:hover { background: #001E4E; }
        .btn-hint { background: #E2E8F0; color: var(--dark); margin-top: auto; }
        .btn-action { background: var(--accent); color: var(--primary); font-weight: bold; margin: 5px 0; }
        .cw-grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 10px 0; }
        .cw-column h4 { margin-bottom: 8px; color: var(--primary); border-bottom: 1px solid #E2E8F0; padding-bottom: 4px; }
        .cw-btn { width: 100%; background: #F4F7FC; color: var(--dark); border: 1px solid #D2Dbe5; padding: 8px; margin-bottom: 6px; font-size: 13px; text-align: left; border-radius: 6px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .splash-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); color: white; flex-direction: column; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; z-index: 2000; text-transform: uppercase; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1.1); } }
    </style>
</head>
<body>

    <header id="app-header" style="display:none;">
        <div class="progress-box" id="progress-indicator">0%</div>
        <div class="vault-container" id="vault-slots">
            <div class="vault-slot"></div><div class="vault-slot"></div><div class="vault-slot"></div>
            <div class="vault-slot"></div><div class="vault-slot"></div><div class="vault-slot"></div>
            <div class="vault-slot"></div>
        </div>
    </header>

    <main class="main-card" id="game-viewport">
        <h2 style="text-align:center; padding: 40px 0;">Synchronizing Engine Vector...</h2>
    </main>

    <div id="hint-modal" class="modal" onclick="closeModal('hint-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="color:var(--primary)">💡 Strategy Insight</h3>
            <p id="hint-modal-text" class="desc-text"></p>
            <button class="btn-submit" onclick="closeModal('hint-modal')">Acknowledged</button>
        </div>
    </div>

    <div id="action-modal" class="modal" onclick="closeModal('action-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="action-modal-title" style="color:var(--primary)">Asset Viewer</h3>
            <div id="action-modal-body" style="min-height:100px;"></div>
            <button class="btn-submit" onclick="closeModal('action-modal')">Close Framework</button>
        </div>
    </div>

    <div id="splash-screen" class="splash-overlay"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsX-ExampLEKeySpAcE2026_Fix",
            authDomain: "jotunhunt2026.firebaseapp.com",
            projectId: "jotunhunt2026",
            databaseURL: "https://jotunhunt2026-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        
        // Strictly force call structures to hit the us-central1 region instance
        const functions = firebase.app().functions("us-central1");
        
        const urlParams = new URLSearchParams(window.location.search);
        const teamToken = urlParams.get('id');

        let localStateCache = null;

        async function refreshViewEngine() {
            if(!teamToken) {
                document.getElementById('game-viewport').innerHTML = `<h2>Access Aborted</h2><p class="desc-text">Missing absolute URL token identifier parameters.</p>`;
                return;
            }
            try {
                const getGameState = functions.httpsCallable('getGameState');
                const result = await getGameState({ token: teamToken });
                localStateCache = result.data;
                renderUI(localStateCache);
            } catch(e) {
                document.getElementById('game-viewport').innerHTML = `<h2>Status Integration Error</h2><p class="desc-text">${e.message}</p>`;
            }
        }

        function renderUI(data) {
            const viewport = document.getElementById('game-viewport');
            const header = document.getElementById('app-header');
            
            if(data.currentStage === 1) {
                header.style.display = "none";
                viewport.innerHTML = `
                    <h2 style="text-align:center;">Identity Matrix Verification</h2>
                    <p class="desc-text" style="text-align:center;">Input your officially registered team name string to initialize verification sequences.</p>
                    <input type="text" id="identity-input" class="input-box" placeholder="EG: ROYAL BLUE">
                    <button class="btn-submit" onclick="triggerIdentityCheck()">Authorize Entry</button>
                    <button class="btn-hint" id="hint-btn-anchor" onclick="triggerHintRequest()">Request Protocol Hint</button>
                `;
                updateHintButtonLabel(data.hintsUsed);
                return;
            }

            header.style.display = "flex";
            document.getElementById('progress-indicator').innerText = `${Math.round(((data.currentStage - 1) / data.totalStages) * 100)}%`;
            
            const slots = document.getElementById('vault-slots').children;
            for(let i=0; i<7; i++) {
                if(data.letters && data.letters[i]) {
                    slots[i].innerText = data.letters[i];
                    slots[i].classList.add('filled');
                } else {
                    slots[i].innerText = "";
                    slots[i].classList.remove('filled');
                }
            }

            if(data.viewType === "FINALE") {
                viewport.innerHTML = `
                    <h2>Quest Finale: Unscramble & Decode</h2>
                    <p class="desc-text">The Letter Vault has integrated into the center frame. Unscramble the letters gathered along your route and decode using the Vigenère engine block metrics.</p>
                    <button class="btn-action" onclick="openConfirmationAsset('FINAL_IMAGE')">Show Visual Cryptogram</button>
                    <button class="btn-action" onclick="openConfirmationAsset('VIGENERE_WHEEL')">Show Cipher Decode Matrix Wheel</button>
                    <input type="text" id="answer-input" class="input-box" placeholder="Enter Ultimate Word Key">
                    <button class="btn-submit" onclick="triggerFinaleCheck()">Verify Ultimate Key</button>
                    <button class="btn-hint" id="hint-btn-anchor" onclick="triggerHintRequest()">Request Hint</button>
                `;
            } else {
                let actionAssetsHTML = '';
                if(data.viewType === "CW") {
                    actionAssetsHTML = `
                        <button class="btn-action" onclick="openConfirmationAsset('CW_SKELETON')">Show Crossword Skeleton Grid Map</button>
                        <div class="cw-grid-menu">
                            <div class="cw-column"><h4>Across</h4>
                                ${Object.entries(data.crosswordClues.across).map(([num, clue])=>`<button class="cw-btn" onclick="alert('Clue ${num}: ${clue}')">${num}. View Clue</button>`).join('')}
                            </div>
                            <div class="cw-column"><h4>Down</h4>
                                ${Object.entries(data.crosswordClues.down).map(([num, clue])=>`<button class="cw-btn" onclick="alert('Clue ${num}: ${clue}')">${num}. View Clue</button>`).join('')}
                            </div>
                        </div>`;
                } else if(data.viewType === "BP") {
                    actionAssetsHTML = `<button class="btn-action" onclick="openConfirmationAsset('BP_IMAGE')">Show Architectural Blueprint Grid</button>`;
                } else if(data.viewType === "MR") {
                    actionAssetsHTML = `
                        <button class="btn-action" onclick="openConfirmationAsset('MR_RULES')">Show Case File Operational Rules</button>
                        <button class="btn-action" onclick="openConfirmationAsset('MR_SKELETON')">Show Room Grid Anatomy Array</button>`;
                }

                viewport.innerHTML = `
                    <h2>${data.heading}</h2>
                    <p class="desc-text">${data.description}</p>
                    ${actionAssetsHTML}
                    <p class="desc-text" style="font-weight:bold; margin-top:10px;">${data.prompt}</p>
                    <input type="text" id="answer-input" class="input-box" placeholder="Input Response Signature">
                    <button class="btn-submit" onclick="triggerAnswerSubmission()">Verify Verification Code</button>
                    <button class="btn-hint" id="hint-btn-anchor" onclick="triggerHintRequest()">Request Hint</button>
                `;
            }
            updateHintButtonLabel(data.hintsUsed);
        }

        async function triggerIdentityCheck() {
            const inputVal = document.getElementById('identity-input').value;
            if(!inputVal.trim()) return;
            try {
                const verifyIdentity = functions.httpsCallable('verifyIdentity');
                await verifyIdentity({ token: teamToken, inputName: inputVal });
                showSplashSplash(`Welcome ${inputVal}`, 1500);
                setTimeout(refreshViewEngine, 1500);
            } catch(e) { alert(e.message); }
        }

        async function triggerAnswerSubmission() {
            const ans = document.getElementById('answer-input').value;
            if(!ans.trim()) return;
            try {
                const submitStageAnswer = functions.httpsCallable('submitStageAnswer');
                const res = await submitStageAnswer({ token: teamToken, answer: ans });
                if(res.data.correct) {
                    showSplashSplash(`${res.data.animationType}!`, 2000);
                    setTimeout(refreshViewEngine, 2000);
                } else { alert("Verification Sequence Denied. Check entry values."); }
            } catch(e) { alert(e.message); }
        }

        async function triggerHintRequest() {
            if(!confirm("Are you sure you want to request a strategy insight hint?")) return;
            try {
                const requestHint = functions.httpsCallable('requestHint');
                const res = await requestHint({ token: teamToken });
                if(res.data.success) {
                    document.getElementById('hint-modal-text').innerText = res.data.hint;
                    document.getElementById('hint-modal').style.display = "flex";
                    updateHintButtonLabel(localStateCache.hintsUsed + 1);
                    localStateCache.hintsUsed++;
                } else { alert(res.data.msg); }
            } catch(e) { alert(e.message); }
        }

        async function triggerFinaleCheck() {
            const finalWord = document.getElementById('answer-input').value;
            if(!finalWord.trim()) return;
            try {
                const submitFinale = functions.httpsCallable('submitFinale');
                const res = await submitFinale({ token: teamToken, finalWord: finalWord });
                if(res.data.correct) {
                    showSplashSplash("VICTORY! Report to Counter.", 10000);
                } else { alert("Incorrect finale decryption pattern."); }
            } catch(e) { alert(e.message); }
        }

        function openConfirmationAsset(type) {
            if(!confirm("Open asset interface module?")) return;
            const body = document.getElementById('action-modal-body');
            const title = document.getElementById('action-modal-title');
            body.innerHTML = '';
            
            if(type === 'CW_SKELETON') {
                title.innerText = "Crossword Wireframe Skeleton";
                body.innerHTML = `<div style="border:2px dashed var(--primary); padding:20px; text-align:center; font-weight:bold;">[Crossword Grid Layout]</div>`;
            } else if(type === 'BP_IMAGE') {
                title.innerText = "Architectural Floor Blueprint";
                body.innerHTML = `<div style="background:#004B87; color:white; padding:30px; text-align:center; font-family:monospace; border-radius:6px;">[HTML Blueprint Matrix Maps]</div>`;
            } else if(type === 'MR_RULES') {
                title.innerText = "Case File Operations Handbook";
                body.innerHTML = `<p class="desc-text">1. No two workers can occupy the same room grid cell matrix.<br>2. Entry points must remain unobstructed.</p>`;
            } else if(type === 'MR_SKELETON') {
                title.innerText = "Murdle Room Skeleton Node";
                body.innerHTML = `<div style="display:grid; grid-template-columns:repeat(3,40px); gap:5px; justify-content:center;"><div style="border:1px solid var(--dark); height:40px;"></div><div style="border:1px solid var(--dark); height:40px;"></div><div style="border:1px solid var(--dark); height:40px;"></div></div>`;
            } else if(type === 'VIGENERE_WHEEL') {
                title.innerText = "Interactive Cipher Processing Wheel";
                body.innerHTML = `<div style="width:120px; height:120px; border-radius:50%; margin:auto; border:5px double var(--primary); display:flex; align-items:center; justify-content:center; font-weight:bold;">ROTATE WHEEL</div>`;
            } else {
                title.innerText = "Cryptogram Vector";
                body.innerHTML = `<div style="font-weight:bold; color:red; text-align:center;">[Final Clue Asset Map]</div>`;
            }
            document.getElementById('action-modal').style.display = "flex";
        }

        function closeModal(id) { document.getElementById(id).style.display = "none"; }
        function showSplashSplash(text, duration) {
            const s = document.getElementById('splash-screen');
            s.innerText = text; s.style.display = "flex";
            setTimeout(() => { s.style.display = "none"; }, duration);
        }
        function updateHintButtonLabel(used) {
            const btn = document.getElementById('hint-btn-anchor');
            if(!btn) return;
            if(used >= 2) { btn.innerText = "Out of Hints"; btn.disabled = true; btn.style.background = "#CBD5E1"; }
            else { btn.innerText = `Request Strategy Insight (${2 - used} Remaining)`; }
        }

        refreshViewEngine();
    </script>
</body>
</html>
