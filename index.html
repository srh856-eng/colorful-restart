<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Hunt 2026</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --jotun-navy: #002D72;
            --jotun-navy-deep: #001A45;
            --jotun-navy-mid: #00408A;
            --jotun-red: #C8102E;
            --jotun-red-light: #E8192F;
            --jotun-gold: #F0A500;
            --jotun-white: #FFFFFF;
            --surface: #F6F8FC;
            --surface-2: #EEF2F9;
            --text-primary: #0D1B35;
            --text-secondary: #4A5778;
            --border: #D4DCF0;
            --radius: 10px;
            --shadow: 0 4px 24px rgba(0,45,114,0.10);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--surface);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        header {
            display: none;
            background: var(--jotun-navy);
            padding: 0 24px;
            height: 64px;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .jotun-logomark {
            width: 36px;
            height: 36px;
            background: var(--jotun-red);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: white;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .header-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 17px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.5px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .progress-pill {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .vault-container {
            display: flex;
            gap: 4px;
        }
        .vault-slot {
            width: 28px;
            height: 30px;
            border: 1.5px dashed rgba(255,255,255,0.25);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: transparent;
            background: rgba(0,0,0,0.2);
            transition: all 0.25s ease;
        }
        .vault-slot.filled {
            border-color: var(--jotun-gold);
            background: rgba(240,165,0,0.15);
            color: var(--jotun-gold);
            animation: vaultPop 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }
        @keyframes vaultPop {
            0%   { transform: scale(0.3) rotate(-25deg) translateY(-14px); opacity: 0; box-shadow: 0 0 0 rgba(240,165,0,0); }
            45%  { transform: scale(1.35) rotate(10deg) translateY(2px); opacity: 1; box-shadow: 0 0 18px rgba(240,165,0,0.8); }
            65%  { transform: scale(0.92) rotate(-4deg) translateY(0); box-shadow: 0 0 10px rgba(240,165,0,0.5); }
            85%  { transform: scale(1.08) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; box-shadow: 0 0 4px rgba(240,165,0,0.25); }
        }

        /* ── MAIN CARD ── */
        .game-wrap {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 16px 48px;
        }
        .main-card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .card-header-band {
            background: var(--jotun-navy);
            padding: 20px 24px 18px;
            position: relative;
            overflow: hidden;
        }
        .card-header-band::after {
            content: '';
            position: absolute;
            right: -20px;
            top: -20px;
            width: 100px;
            height: 100px;
            background: var(--jotun-red);
            opacity: 0.15;
            border-radius: 50%;
        }
        .stage-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 6px;
        }
        .card-heading {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: white;
            line-height: 1.1;
        }
        .card-body {
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .desc-text {
            font-size: 14px;
            line-height: 1.65;
            color: var(--text-secondary);
        }
        .prompt-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--jotun-navy);
            letter-spacing: 0.2px;
        }
        .input-box {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: var(--surface);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-box:focus {
            border-color: var(--jotun-navy);
            box-shadow: 0 0 0 3px rgba(0,45,114,0.08);
            background: white;
        }
        .btn {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: var(--jotun-navy);
            color: white;
        }
        .btn-primary:hover { background: var(--jotun-navy-mid); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-accent {
            background: var(--jotun-red);
            color: white;
        }
        .btn-accent:hover { background: var(--jotun-red-light); transform: translateY(-1px); }
        .btn-ghost {
            background: var(--surface-2);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--surface); color: var(--text-primary); }
        .btn-ghost:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ── CROSSWORD CLUES ── */
        .cw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .cw-col-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .cw-clue-btn {
            width: 100%;
            text-align: left;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 8px 10px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            cursor: pointer;
            margin-bottom: 5px;
            transition: all 0.15s;
        }
        .cw-clue-btn:hover { background: var(--jotun-navy); color: white; border-color: var(--jotun-navy); }

        .divider { height: 1px; background: var(--border); margin: 2px 0; }

        /* ── ERROR STATE ── */
        .error-state {
            text-align: center;
            padding: 40px 24px;
        }
        .error-icon {
            width: 56px;
            height: 56px;
            background: rgba(200,16,46,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .error-icon svg { color: var(--jotun-red); }
        .error-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .error-msg { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

        /* ── LOADING STATE ── */
        .loading-state {
            text-align: center;
            padding: 52px 24px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--jotun-navy);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-label { font-size: 13px; color: var(--text-secondary); }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,20,50,0.55);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-box {
            background: white;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.25s ease;
        }
        .modal-box.wide { max-width: 520px; }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            background: var(--jotun-navy);
            padding: 16px 20px;
        }
        .modal-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: white;
        }
        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .hint-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
            background: var(--surface);
            border-left: 3px solid var(--jotun-gold);
            padding: 12px 14px;
            border-radius: 0 8px 8px 0;
        }

        /* ── SPLASH ── */
        .splash-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--jotun-navy);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .splash-text {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            animation: splashPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .splash-bar {
            width: 60px;
            height: 4px;
            background: var(--jotun-red);
            border-radius: 2px;
            margin-top: 16px;
            animation: barGrow 0.4s ease 0.3s both;
        }
        @keyframes splashPop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes barGrow {
            from { width: 0; }
            to { width: 60px; }
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            z-index: 3000;
            transition: transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--jotun-red); }

        /* ── FOOTER BRAND ── */
        .footer-brand {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #B0BCDA;
            letter-spacing: 0.5px;
        }

        /* ── GAME OVER FREEZE OVERLAY ── */
        .freeze-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 10, 30, 0.88);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 4000;
            flex-direction: column;
            gap: 16px;
            padding: 32px;
        }
        .freeze-overlay.active { display: flex; }
        .freeze-icon {
            font-size: 48px;
            animation: freezePop 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .freeze-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: white;
            text-align: center;
            letter-spacing: 1px;
            animation: freezePop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) 0.1s both;
        }
        .freeze-subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            text-align: center;
            max-width: 320px;
            line-height: 1.6;
            animation: freezePop 0.5s ease 0.25s both;
        }
        @keyframes freezePop {
            from { transform: scale(0.8) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* ── VICTORY OVERLAY ── */
        .victory-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--jotun-navy-deep);
            align-items: center;
            justify-content: center;
            z-index: 4000;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }
        .victory-overlay.active { display: flex; }
        .victory-confetti-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .victory-content {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 32px;
        }
        .victory-trophy {
            font-size: 72px;
            animation: trophyBounce 0.8s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        @keyframes trophyBounce {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .victory-headline {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 56px;
            font-weight: 800;
            color: var(--jotun-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(240,165,0,0.5);
            animation: victoryFadeIn 0.6s ease 0.3s both;
        }
        .victory-team {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
            animation: victoryFadeIn 0.6s ease 0.5s both;
        }
        .victory-instruct {
            font-size: 14px;
            color: rgba(255,255,255,0.55);
            margin-top: 8px;
            animation: victoryFadeIn 0.6s ease 0.7s both;
        }
        @keyframes victoryFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── FINALE TREASURE ROOM ── */
        .finale-card {
            position: relative;
            overflow: hidden;
            background: #0a0e1a;
            border: 1px solid #1a2540;
        }
        .finale-cipher-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            opacity: 0.07;
            font-family: 'Barlow Condensed', monospace;
            font-size: 9px;
            font-weight: 600;
            color: #7ba7e0;
            letter-spacing: 2px;
            line-height: 1.4;
            padding: 8px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .finale-header-band {
            background: linear-gradient(135deg, #0d1833 0%, #1a2d55 100%);
            padding: 20px 24px 18px;
            position: relative;
            z-index: 1;
            border-bottom: 1px solid rgba(240,165,0,0.2);
        }
        .finale-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--jotun-gold);
            margin-bottom: 6px;
            opacity: 0.8;
        }
        .finale-heading {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #e8dfc0;
            line-height: 1.1;
        }
        .finale-body {
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
        }
        .finale-desc {
            font-size: 14px;
            line-height: 1.7;
            color: #8fa3c4;
        }
        .finale-key-phrase {
            font-size: 17px;
            font-weight: 600;
            color: #e8dfc0;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 6px 0;
        }
        .finale-divider {
            height: 1px;
            background: rgba(240,165,0,0.15);
            margin: 2px 0;
        }

        /* ── LETTER PILE ANIMATION ── */
        .letter-pile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            padding: 10px 0 4px;
            position: relative;
        }
        .letter-tile {
            width: 32px;
            height: 36px;
            border: 1.5px solid rgba(240,165,0,0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--jotun-gold);
            background: rgba(240,165,0,0.08);
            opacity: 0;
            transform: translate(140px, -90px) rotate(60deg) scale(0.4);
        }
        .letter-tile.drop {
            animation: letterFlyIn 0.65s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        @keyframes letterFlyIn {
            0%   { opacity: 0; transform: translate(140px, -90px) rotate(60deg) scale(0.4); box-shadow: 0 0 0 rgba(240,165,0,0); }
            55%  { opacity: 1; transform: translate(-6px, 6px) rotate(-8deg) scale(1.15); box-shadow: 0 0 16px rgba(240,165,0,0.7); }
            75%  { transform: translate(2px, -2px) rotate(4deg) scale(0.95); }
            100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); box-shadow: 0 0 4px rgba(240,165,0,0.2); }
        }

        /* ── FINALE INPUT THEME ── */
        .finale-input {
            background: rgba(255,255,255,0.05) !important;
            border-color: rgba(240,165,0,0.3) !important;
            color: #e8dfc0 !important;
        }
        .finale-input:focus {
            border-color: var(--jotun-gold) !important;
            box-shadow: 0 0 0 3px rgba(240,165,0,0.12) !important;
        }
        .finale-input::placeholder { color: rgba(200,200,200,0.25); }
        .finale-prompt-label {
            color: rgba(232,223,192,0.7) !important;
        }
        .btn-finale-primary {
            background: linear-gradient(135deg, #8a5c00, #c48000);
            color: #fff8e0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .btn-finale-primary:hover {
            background: linear-gradient(135deg, #a06c00, #d99000);
            transform: translateY(-1px);
        }
        .btn-finale-ghost {
            background: rgba(255,255,255,0.05);
            color: rgba(200,210,230,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-finale-ghost:hover {
            background: rgba(255,255,255,0.1);
            color: rgba(200,210,230,0.9);
        }
        .btn-finale-ghost:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .btn-finale-accent {
            background: rgba(0,45,114,0.7);
            color: #a8c0e8;
            border: 1px solid rgba(100,150,220,0.25);
        }
        .btn-finale-accent:hover {
            background: rgba(0,64,138,0.8);
            color: #c0d4f0;
            transform: translateY(-1px);
        }

       /* ── ROT13 LOOKUP TABLE GRID ── */
        .rot13-container {
            max-width: 100%;
            margin: 8px 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            text-align: center;
        }
        .rot13-container h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--jotun-navy);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .rot13-table {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Barlow Condensed', monospace;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            overflow-x: auto;
        }
        .rot13-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .rot13-cell {
            flex: 1;
            padding: 8px 0;
            text-align: center;
        }
        .rot13-cell:not(:last-child) {
            border-right: 1px solid var(--surface-2);
        }
        .top-row {
            background-color: rgba(0, 45, 114, 0.05);
            color: var(--jotun-navy);
        }
        .bottom-row {

            };

            // Vigenère decode: plain = (cipher - keyShift) mod 26
            window.wheelDecode = function() {
                const inp = document.getElementById('wheel-cipher-input');
                const out = document.getElementById('wheel-plain-output');
                if (!inp || !out) return;
                const ch = (inp.value || "").toUpperCase().replace(/[^A-Z]/g, "");
                inp.value = ch;
                if (!ch) { out.value = ""; return; }
                const cipherIdx = ALPHA.indexOf(ch);
                out.value = ALPHA[((cipherIdx - keyShift) % 26 + 26) % 26];
            };

            window.rotateWheel = function(steps) {
                if (steps === -999) { innerRotation = 0; }
                else { innerRotation += steps * (360 / 26); }
                innerSVG.style.transition = "transform 0.15s ease";
                innerSVG.style.transform = `translate(-50%, -50%) rotate(${innerRotation}deg)`;
                updateReadout();
            };

            // Drag to rotate inner wheel — mouse + touch support
            const wrap = document.getElementById('wheel-svg-wrap');
            let dragging = false, lastAngle = 0;

            function getAngleFromEvent(clientX, clientY) {
                const rect = wrap.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
            }

            function dragStart(clientX, clientY) {
                dragging = true;
                lastAngle = getAngleFromEvent(clientX, clientY);
            }
            function dragMove(clientX, clientY) {
                if (!dragging) return;
                const angle = getAngleFromEvent(clientX, clientY);
                innerRotation += angle - lastAngle;
                lastAngle = angle;
                innerSVG.style.transition = "none";
                innerSVG.style.transform = `translate(-50%, -50%) rotate(${innerRotation}deg)`;
                updateReadout();
            }
            function dragEnd() {
                if (!dragging) return;
                dragging = false;
                const step = 360 / 26;
                innerRotation = Math.round(innerRotation / step) * step;
                innerSVG.style.transition = "transform 0.15s ease";
                innerSVG.style.transform = `translate(-50%, -50%) rotate(${innerRotation}deg)`;
                updateReadout();
            }

            wrap.addEventListener('mousedown', (e) => dragStart(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => dragMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', dragEnd);

            wrap.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                dragStart(t.clientX, t.clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                const t = e.touches[0];
                dragMove(t.clientX, t.clientY);
            }, { passive: true });
            window.addEventListener('touchend', dragEnd);

            drawOuter();
            drawInner();
            updateReadout();

            document.getElementById('action-modal').style.display = "flex";
        }

        function closeModal(id) { document.getElementById(id).style.display = "none"; }

        function showSplash(text, duration) {
            document.getElementById('splash-text').innerText = text;
            document.getElementById('splash-screen').style.display = "flex";
            setTimeout(() => { document.getElementById('splash-screen').style.display = "none"; }, duration);
        }

        let toastTimer;
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            clearTimeout(toastTimer);
            requestAnimationFrame(() => { t.classList.add('show'); });
            toastTimer = setTimeout(() => { t.classList.remove('show'); }, 3500);
        }

        function updateHintButtonLabel(used, isFinale = false) {
            const btn = document.getElementById('hint-btn-anchor');
            if (!btn) return;
            const remaining = 2 - used;
            if (remaining <= 0) {
                btn.innerText = "No hints remaining";
                btn.disabled = true;
            } else {
                btn.innerText = `Request a Hint (${remaining} remaining)`;
                btn.disabled = false;
            }
        }

        // ── WINNER / FREEZE ──
        function showVictory(teamName) {
            gameFrozen = true;
            document.getElementById('victory-team-name').innerText = teamName;
            document.getElementById('victory-overlay').classList.add('active');
            launchConfetti();
        }

        function showFreeze(winnerName) {
            gameFrozen = true;
            document.getElementById('freeze-title').innerText = `The hunt is over.`;
            document.getElementById('freeze-subtitle').innerText = `${winnerName} has found the treasure first. The game has ended. Well played!`;
            document.getElementById('freeze-overlay').classList.add('active');
        }

        // ── CONFETTI ──
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const COLORS = ['#F0A500','#C8102E','#002D72','#ffffff','#10B981','#a855f7'];
            const pieces = Array.from({ length: 160 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 5 + 3,
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                angle: Math.random() * 360,
                spin: (Math.random() - 0.5) * 4,
                vx: (Math.random() - 0.5) * 3,
                vy: Math.random() * 3 + 1.5
            }));

            function frame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.angle += p.spin;
                    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    ctx.save();
                    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
                    ctx.rotate(p.angle * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });
                requestAnimationFrame(frame);
            }
            frame();
        }
