<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Hunt 2026</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --jotun-navy: #002D72;
            --jotun-navy-deep: #001A45;
            --jotun-navy-mid: #00408A;
            --jotun-red: #C8102E;
            --jotun-red-light: #E8192F;
            --jotun-gold: #F0A500;
            --jotun-white: #FFFFFF;
            --surface: #F6F8FC;
            --surface-2: #EEF2F9;
            --text-primary: #0D1B35;
            --text-secondary: #4A5778;
            --border: #D4DCF0;
            --radius: 10px;
            --shadow: 0 4px 24px rgba(0,45,114,0.10);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--surface);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        header {
            display: none;
            background: var(--jotun-navy);
            padding: 0 24px;
            height: 64px;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .jotun-logomark {
            width: 36px;
            height: 36px;
            background: var(--jotun-red);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: white;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .header-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 17px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.5px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .progress-pill {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .vault-container {
            display: flex;
            gap: 4px;
        }
        .vault-slot {
            width: 28px;
            height: 30px;
            border: 1.5px dashed rgba(255,255,255,0.25);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: transparent;
            background: rgba(0,0,0,0.2);
            transition: all 0.25s ease;
        }
        .vault-slot.filled {
            border-color: var(--jotun-gold);
            background: rgba(240,165,0,0.15);
            color: var(--jotun-gold);
            transform: scale(1.08);
            animation: popIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        /* ── MAIN CARD ── */
        .game-wrap {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 16px 48px;
        }
        .main-card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .card-header-band {
            background: var(--jotun-navy);
            padding: 20px 24px 18px;
            position: relative;
            overflow: hidden;
        }
        .card-header-band::after {
            content: '';
            position: absolute;
            right: -20px;
            top: -20px;
            width: 100px;
            height: 100px;
            background: var(--jotun-red);
            opacity: 0.15;
            border-radius: 50%;
        }
        .stage-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 6px;
        }
        .card-heading {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: white;
            line-height: 1.1;
        }
        .card-body {
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .desc-text {
            font-size: 14px;
            line-height: 1.65;
            color: var(--text-secondary);
        }
        .prompt-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--jotun-navy);
            letter-spacing: 0.2px;
        }
        .input-box {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: var(--surface);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-box:focus {
            border-color: var(--jotun-navy);
            box-shadow: 0 0 0 3px rgba(0,45,114,0.08);
            background: white;
        }
        .btn {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: var(--jotun-navy);
            color: white;
        }
        .btn-primary:hover { background: var(--jotun-navy-mid); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-accent {
            background: var(--jotun-red);
            color: white;
        }
        .btn-accent:hover { background: var(--jotun-red-light); transform: translateY(-1px); }
        .btn-ghost {
            background: var(--surface-2);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--surface); color: var(--text-primary); }
        .btn-ghost:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ── CROSSWORD CLUES ── */
        .cw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .cw-col-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .cw-clue-btn {
            width: 100%;
            text-align: left;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 8px 10px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            cursor: pointer;
            margin-bottom: 5px;
            transition: all 0.15s;
        }
        .cw-clue-btn:hover { background: var(--jotun-navy); color: white; border-color: var(--jotun-navy); }

        .divider { height: 1px; background: var(--border); margin: 2px 0; }

        /* ── ERROR STATE ── */
        .error-state {
            text-align: center;
            padding: 40px 24px;
        }
        .error-icon {
            width: 56px;
            height: 56px;
            background: rgba(200,16,46,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .error-icon svg { color: var(--jotun-red); }
        .error-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .error-msg { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

        /* ── LOADING STATE ── */
        .loading-state {
            text-align: center;
            padding: 52px 24px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--jotun-navy);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-label { font-size: 13px; color: var(--text-secondary); }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,20,50,0.55);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-box {
            background: white;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            background: var(--jotun-navy);
            padding: 16px 20px;
        }
        .modal-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: white;
        }
        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .hint-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
            background: var(--surface);
            border-left: 3px solid var(--jotun-gold);
            padding: 12px 14px;
            border-radius: 0 8px 8px 0;
        }

        /* ── SPLASH ── */
        .splash-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--jotun-navy);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .splash-text {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            animation: splashPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .splash-bar {
            width: 60px;
            height: 4px;
            background: var(--jotun-red);
            border-radius: 2px;
            margin-top: 16px;
            animation: barGrow 0.4s ease 0.3s both;
        }
        @keyframes splashPop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes barGrow {
            from { width: 0; }
            to { width: 60px; }
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            z-index: 3000;
            transition: transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--jotun-red); }

        /* ── FOOTER BRAND ── */
        .footer-brand {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #B0BCDA;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header id="app-header">
        <div class="header-brand">
            <div class="jotun-logomark">J</div>
            <span class="header-title">JOTUN HUNT 2026</span>
        </div>
        <div class="header-right">
            <span class="progress-pill" id="progress-indicator">0%</span>
            <div class="vault-container" id="vault-slots">
                <div class="vault-slot"></div>
                <div class="vault-slot"></div>
                <div class="vault-slot"></div>
                <div class="vault-slot"></div>
                <div class="vault-slot"></div>
                <div class="vault-slot"></div>
                <div class="vault-slot"></div>
            </div>
        </div>
    </header>

    <div class="game-wrap">
        <div class="main-card" id="game-viewport">
            <div class="loading-state">
                <div class="spinner"></div>
                <p class="loading-label">Loading your quest…</p>
            </div>
        </div>
    </div>

    <div class="footer-brand">JOTUN · HUNT 2026</div>

    <div id="hint-modal" class="modal" onclick="closeModal('hint-modal')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">💡 Hint</div>
            </div>
            <div class="modal-body">
                <p id="hint-modal-text" class="hint-text"></p>
                <button class="btn btn-primary" onclick="closeModal('hint-modal')">Got it</button>
            </div>
        </div>
    </div>

    <div id="action-modal" class="modal" onclick="closeModal('action-modal')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="action-modal-title">Asset Viewer</div>
            </div>
            <div class="modal-body">
                <div id="action-modal-body"></div>
                <button class="btn btn-ghost" onclick="closeModal('action-modal')">Close</button>
            </div>
        </div>
    </div>

    <div id="clue-modal" class="modal" onclick="closeModal('clue-modal')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="clue-modal-title">Clue</div>
            </div>
            <div class="modal-body">
                <p id="clue-modal-text" class="hint-text"></p>
                <button class="btn btn-primary" onclick="closeModal('clue-modal')">OK</button>
            </div>
        </div>
    </div>

    <div id="splash-screen" class="splash-overlay">
        <div class="splash-text" id="splash-text"></div>
        <div class="splash-bar"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsX-ExampLEKeySpAcE2026_Fix",
            authDomain: "jotunhunt2026.firebaseapp.com",
            projectId: "jotunhunt2026"
        };
        firebase.initializeApp(firebaseConfig);

        const CLOUD_FUNCTIONS_BASE_URL = "https://asia-southeast1-jotunhunt2026.cloudfunctions.net";

        const urlParams = new URLSearchParams(window.location.search);
        const teamToken = urlParams.get('id');

        let localStateCache = null;

        // ── API HELPER ──
        async function callCloudEndpoint(endpointName, payload) {
            const response = await fetch(`${CLOUD_FUNCTIONS_BASE_URL}/${endpointName}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ data: payload })
            });
            const json = await response.json();
            if (!response.ok || json.error) {
                throw new Error(json.error?.message || "Something went wrong. Please try again.");
            }
            return json.result;
        }

        // ── MAIN LOAD ──
        async function refreshViewEngine() {
            if (!teamToken) {
                renderErrorState(
                    "Link Invalid",
                    "Your access link is missing a team token. Please use the link provided to you by the organizer."
                );
                return;
            }
            setLoading();
            try {
                const data = await callCloudEndpoint('getGameState', { token: teamToken });
                localStateCache = data;
                renderUI(data);
            } catch (e) {
                renderErrorState("Unable to Load", e.message);
            }
        }

        function setLoading() {
            document.getElementById('game-viewport').innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p class="loading-label">Loading your quest…</p>
                </div>`;
        }

        function renderErrorState(title, msg) {
            document.getElementById('game-viewport').innerHTML = `
                <div class="error-state">
                    <div class="error-icon">
                        <svg width="24" height="24" fill="none" stroke="#C8102E" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="1" fill="#C8102E" stroke="none"/>
                        </svg>
                    </div>
                    <p class="error-title">${title}</p>
                    <p class="error-msg">${msg}</p>
                </div>`;
        }

        // ── RENDER ──
        function renderUI(data) {
            const viewport = document.getElementById('game-viewport');
            const header = document.getElementById('app-header');

            if (data.currentStage === 1) {
                header.style.display = "none";
                viewport.innerHTML = `
                    <div class="card-header-band">
                        <div class="stage-eyebrow">Welcome</div>
                        <div class="card-heading">Identify Your Team</div>
                    </div>
                    <div class="card-body">
                        <p class="desc-text">Enter your officially registered team name to begin. It must match exactly.</p>
                        <div class="divider"></div>
                        <label class="prompt-label">Team Name</label>
                        <input type="text" id="identity-input" class="input-box" placeholder="" autocomplete="off">
                        <button class="btn btn-primary" onclick="triggerIdentityCheck()">Begin the Hunt →</button>
                        <button class="btn btn-ghost" id="hint-btn-anchor" onclick="triggerHintRequest()">Request a Hint (2 remaining)</button>
                    </div>`;
                updateHintButtonLabel(data.hintsUsed);
                return;
            }

            header.style.display = "flex";
            document.getElementById('progress-indicator').innerText =
                `${Math.round(((data.currentStage - 1) / data.totalStages) * 100)}%`;

            const slots = document.getElementById('vault-slots').children;
            for (let i = 0; i < 7; i++) {
                if (data.letters && data.letters[i]) {
                    slots[i].innerText = data.letters[i];
                    slots[i].classList.add('filled');
                } else {
                    slots[i].innerText = "";
                    slots[i].classList.remove('filled');
                }
            }

            if (data.viewType === "FINALE") {
                viewport.innerHTML = `
                    <div class="card-header-band">
                        <div class="stage-eyebrow">Final Stage</div>
                        <div class="card-heading">Decode & Conquer</div>
                    </div>
                    <div class="card-body">
                        <p class="desc-text">You've collected all the letters. Unscramble them and decode the final word using the Vigenère cipher.</p>
                        <button class="btn btn-accent" onclick="openConfirmationAsset('FINAL_IMAGE')">View Final Cryptogram</button>
                        <button class="btn btn-accent" onclick="openConfirmationAsset('VIGENERE_WHEEL')">View Vigenère Cipher Wheel</button>
                        <div class="divider"></div>
                        <label class="prompt-label">Enter the Final Word</label>
                        <input type="text" id="answer-input" class="input-box" placeholder="Enter decoded word" autocomplete="off">
                        <button class="btn btn-primary" onclick="triggerFinaleCheck()">Submit Final Answer</button>
                        <button class="btn btn-ghost" id="hint-btn-anchor" onclick="triggerHintRequest()">Request a Hint</button>
                    </div>`;
                updateHintButtonLabel(data.hintsUsed);
                return;
            }

            let actionHTML = '';
            if (data.viewType === "CW") {
                actionHTML = `
                    <button class="btn btn-accent" onclick="openConfirmationAsset('CW_SKELETON')">View Crossword Grid</button>
                    <div class="cw-grid">
                        <div>
                            <div class="cw-col-label">Across</div>
                            ${Object.entries(data.crosswordClues.across).map(([num, clue]) =>
                                `<button class="cw-clue-btn" onclick="showClue(${num}, '${clue.replace(/'/g,"\\'")}', 'Across')">${num}. View clue</button>`
                            ).join('')}
                        </div>
                        <div>
                            <div class="cw-col-label">Down</div>
                            ${Object.entries(data.crosswordClues.down).map(([num, clue]) =>
                                `<button class="cw-clue-btn" onclick="showClue(${num}, '${clue.replace(/'/g,"\\'")}', 'Down')">${num}. View clue</button>`
                            ).join('')}
                        </div>
                    </div>`;
            } else if (data.viewType === "BP") {
                actionHTML = `<button class="btn btn-accent" onclick="openConfirmationAsset('BP_IMAGE')">View Floor Blueprint</button>`;
            } else if (data.viewType === "MR") {
                actionHTML = `
                    <button class="btn btn-accent" onclick="openConfirmationAsset('MR_RULES')">View Case File Rules</button>
                    <button class="btn btn-accent" onclick="openConfirmationAsset('MR_SKELETON')">View Room Grid</button>`;
            }

            viewport.innerHTML = `
                <div class="card-header-band">
                    <div class="stage-eyebrow">Stage ${data.currentStage} of ${data.totalStages}</div>
                    <div class="card-heading">${data.heading}</div>
                </div>
                <div class="card-body">
                    <p class="desc-text">${data.description}</p>
                    ${actionHTML ? `<div class="divider"></div>${actionHTML}<div class="divider"></div>` : ''}
                    <label class="prompt-label">${data.prompt}</label>
                    <input type="text" id="answer-input" class="input-box" placeholder="Your answer" autocomplete="off">
                    <button class="btn btn-primary" onclick="triggerAnswerSubmission()">Submit Answer</button>
                    <button class="btn btn-ghost" id="hint-btn-anchor" onclick="triggerHintRequest()">Request a Hint</button>
                </div>`;
            updateHintButtonLabel(data.hintsUsed);
        }

        // ── ACTIONS ──
        async function triggerIdentityCheck() {
            const inputVal = document.getElementById('identity-input').value;
            if (!inputVal.trim()) return;
            try {
                await callCloudEndpoint('verifyIdentity', { token: teamToken, inputName: inputVal });
                showSplash(`Welcome, ${inputVal}!`, 1800);
                setTimeout(refreshViewEngine, 1800);
            } catch (e) { showToast(e.message, true); }
        }

        async function triggerAnswerSubmission() {
            const ans = document.getElementById('answer-input').value;
            if (!ans.trim()) return;
            try {
                const res = await callCloudEndpoint('submitStageAnswer', { token: teamToken, answer: ans });
                if (res.correct) {
                    showSplash(res.animationType + '!', 2000);
                    setTimeout(refreshViewEngine, 2000);
                } else {
                    showToast("That's not quite right. Try again.", true);
                }
            } catch (e) { showToast(e.message, true); }
        }

        // ── FIXED: Complete front-end request pipeline utilizing atomic server callbacks ──
        async function triggerHintRequest() {
            const btn = document.getElementById('hint-btn-anchor');
            if (btn && btn.disabled) return; 
            if (!confirm("Use one of your hints? You only have 2.")) return;
            
            if (btn) btn.disabled = true; // Instantly lock out malicious double clicks
            
            try {
                const res = await callCloudEndpoint('requestHint', { token: teamToken });
                if (res.success) {
                    document.getElementById('hint-modal-text').innerText = res.hint;
                    document.getElementById('hint-modal').style.display = "flex";
                    
                    // 🛑 FIXED: Update client-side parameters cleanly from the verified server response metric
                    localStateCache.hintsUsed = 2 - res.remaining; 
                    updateHintButtonLabel(localStateCache.hintsUsed);
                } else {
                    showToast(res.message || "You've used all your hints.", true);
                    updateHintButtonLabel(2); // Hard lock layout configuration to max configuration boundaries
                }
            } catch (e) { 
                showToast(e.message, true); 
                if (localStateCache) updateHintButtonLabel(localStateCache.hintsUsed);
            }
        }

        async function triggerFinaleCheck() {
            const finalWord = document.getElementById('answer-input').value;
            if (!finalWord.trim()) return;
            try {
                const res = await callCloudEndpoint('submitFinale', { token: teamToken, finalWord });
                if (res.correct) {
                    showSplash("VICTORY! Report to the counter.", 12000);
                } else {
                    showToast("Incorrect. Check your cipher decoding.", true);
                }
            } catch (e) { showToast(e.message, true); }
        }

        function showClue(num, clue, direction) {
            document.getElementById('clue-modal-title').innerText = `${direction} ${num}`;
            document.getElementById('clue-modal-text').innerText = clue;
            document.getElementById('clue-modal').style.display = "flex";
        }

        function openConfirmationAsset(type) {
            if (!confirm("Open this asset?")) return;
            const body = document.getElementById('action-modal-body');
            const title = document.getElementById('action-modal-title');
            body.innerHTML = '';

            if (type === 'CW_SKELETON') {
                title.innerText = "Crossword Grid";
                body.innerHTML = `<div style="border:2px dashed var(--jotun-navy);padding:24px;text-align:center;font-weight:600;color:var(--text-secondary);border-radius:8px;">[Crossword Grid Layout]</div>`;
            } else if (type === 'BP_IMAGE') {
                title.innerText = "Floor Blueprint";
                body.innerHTML = `<div style="background:var(--jotun-navy);color:white;padding:32px;text-align:center;font-family:monospace;border-radius:8px;font-size:13px;">[HTML Blueprint Matrix Map]</div>`;
            } else if (type === 'MR_RULES') {
                title.innerText = "Case File Rules";
                body.innerHTML = `<div class="hint-text">1. No two workers can occupy the same room cell.<br><br>2. Entry points must remain unobstructed.</div>`;
            } else if (type === 'MR_SKELETON') {
                title.innerText = "Room Grid";
                body.innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,44px);gap:6px;justify-content:center;">${Array(9).fill('<div style="border:1.5px solid var(--border);height:44px;border-radius:4px;"></div>').join('')}</div>`;
            } else if (type === 'VIGENERE_WHEEL') {
                title.innerText = "Vigenère Cipher Wheel";
                body.innerHTML = `<div style="width:120px;height:120px;border-radius:50%;margin:auto;border:4px double var(--jotun-navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--jotun-navy);">CIPHER<br>WHEEL</div>`;
            } else {
                title.innerText = "Final Clue";
                body.innerHTML = `<div style="font-weight:700;color:var(--jotun-red);text-align:center;padding:20px;">[Final Clue Asset]</div>`;
            }
            document.getElementById('action-modal').style.display = "flex";
        }

        function closeModal(id) { document.getElementById(id).style.display = "none"; }

        function showSplash(text, duration) {
            document.getElementById('splash-text').innerText = text;
            document.getElementById('splash-screen').style.display = "flex";
            setTimeout(() => { document.getElementById('splash-screen').style.display = "none"; }, duration);
        }

        let toastTimer;
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            clearTimeout(toastTimer);
            requestAnimationFrame(() => { t.classList.add('show'); });
            toastTimer = setTimeout(() => { t.classList.remove('show'); }, 3500);
        }

        function updateHintButtonLabel(used) {
            const btn = document.getElementById('hint-btn-anchor');
            if (!btn) return;
            const remaining = 2 - used;
            if (remaining <= 0) {
                btn.innerText = "No hints remaining";
                btn.disabled = true;
            } else {
                btn.innerText = `Request a Hint (${remaining} remaining)`;
                btn.disabled = false;
            }
        }

        refreshViewEngine();
    </script>
</body>
</html>
