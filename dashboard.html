<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Hunt 2026 · Analytics</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --jotun-navy: #002D72;
            --jotun-navy-deep: #001A45;
            --jotun-navy-mid: #00408A;
            --jotun-red: #C8102E;
            --jotun-gold: #F0A500;
            --jotun-green: #10B981;
            --surface: #F4F7FC;
            --surface-2: #EBF0FA;
            --text-main: #1E293B;
            --text-sub: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--surface); color: var(--text-main); padding: 30px; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 3px solid var(--jotun-navy); padding-bottom: 15px; }
        h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px; color: var(--jotun-navy); letter-spacing: 0.5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,45,114,0.04); border: 1px solid rgba(0,45,114,0.06); text-align: center; }
        .stat-card h3 { font-size: 13px; text-transform: uppercase; color: var(--text-sub); margin-bottom: 8px; letter-spacing: 0.5px; }
        .stat-card p { font-size: 28px; font-weight: 700; color: var(--jotun-navy-deep); }
        .table-container { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,45,114,0.05); border: 1px solid rgba(0,45,114,0.06); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--jotun-navy-deep); color: white; padding: 16px 20px; font-size: 13px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        td { padding: 18px 20px; border-bottom: 1px solid var(--surface-2); font-size: 15px; font-weight: 500; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .rank-cell { display: flex; align-items: center; gap: 15px; }
        .rank-num { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-sub); }
        .rank-num.gold { background: #FFDF00; color: #8A6D00; }
        .rank-num.silver { background: #E4E4E4; color: #555555; }
        .rank-num.bronze { background: #CD7F32; color: #FFFFFF; }
        .team-name { font-weight: 600; color: var(--jotun-navy-deep); }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-stage { background: var(--surface-2); color: var(--jotun-navy-mid); }
        .badge-done { background: rgba(16,185,129,0.12); color: var(--jotun-green); border: 1px solid rgba(16,185,129,0.2); }
        .dash-letter-box { width: 24px; height: 24px; border: 1px solid #D1D5DB; background: #F9FAFB; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 11px; font-weight: 700; color: #9CA3AF; margin-right: 3px; }
        .dash-letter-box.active { background: var(--jotun-navy); color: white; border-color: var(--jotun-navy); }
        .hints-pill { padding: 4px 10px; border-radius: 6px; background: #F1F5F9; font-size: 13px; font-weight: 600; color: #475569; }
        .hints-pill.maxed { background: rgba(200,16,46,0.1); color: var(--jotun-red); }
        .time-cell { color: var(--text-sub); font-size: 13px; }
        .empty-state { text-align: center; color: var(--text-sub); padding: 40px !important; font-style: italic; }
        .row-completed { background-color: rgba(16,185,129,0.03); }
    </style>
</head>
<body>

    <header>
        <h1>Jotun Hunt 2026 Dashboard</h1>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><h3>Total Teams</h3><p id="stat-total">0</p></div>
        <div class="stat-card"><h3>Completed</h3><p id="stat-done">0</p></div>
        <div class="stat-card"><h3>Active Hunting</h3><p id="stat-active">0</p></div>
        <div class="stat-card"><h3>Average Stage</h3><p id="stat-avg">—</p></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Team Name</th>
                    <th>Status / Current Stage</th>
                    <th>Letters Collected</th>
                    <th>Hints Used</th>
                    <th>Last Active Update</th>
                </tr>
            </thead>
            <tbody id="leaderboard-stream-target">
                <tr class="empty-state">
                    <td colspan="5">⏳ Connecting to Firebase Realtime Database...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Realtime Database Web Configuration
        const firebaseConfig = {
            databaseURL: "https://jotunhunt2026-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        // Safe Initialization Block
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function getRankClass(idx) {
            if (idx === 0) return 'gold';
            if (idx === 1) return 'silver';
            if (idx === 2) return 'bronze';
            return '';
        }

        // Direct Stream listener on the correct path 'gameData/teams'
        db.ref('gameData/teams').on('value', (snapshot) => {
            try {
                const data = snapshot.val();
                const target = document.getElementById('leaderboard-stream-target');

                if (!target) return; // Prevent loop crash if element isn't ready

                if (!data) {
                    target.innerHTML = `
                        <tr class="empty-state">
                            <td colspan="5">⏳ Waiting for teams to log in and begin the hunt...</td>
                        </tr>`;
                    updateStats([]);
                    return;
                }

                // Map data parameters cleanly
                const teams = Object.keys(data).map(token => ({
                    token: token,
                    ...data[token]
                }));

                // Sort: Finished teams first, then highest stage, then fewest hints used
                teams.sort((a, b) => {
                    if (a.isCompleted && !b.isCompleted) return -1;
                    if (!a.isCompleted && b.isCompleted) return 1;
                    if ((b.currentStage || 1) !== (a.currentStage || 1)) {
                        return (b.currentStage || 1) - (a.currentStage || 1);
                    }
                    return (a.hintsUsed || 0) - (b.hintsUsed || 0);
                });

                updateStats(teams);

                target.innerHTML = teams.map((team, idx) => {
                    let stageBadge = `<span class="badge badge-stage">Stage ${team.currentStage || 1} / 7</span>`;
                    if (team.isCompleted) {
                        stageBadge = `<span class="badge badge-done">🏁 Finished</span>`;
                    }

                    // Active time tracking calculation
                    const elapsedMin = Math.max(0, Math.floor((Date.now() - (team.lastActive || Date.now())) / 60000));
                    const timeStr = elapsedMin === 0 ? 'Just now' : `${elapsedMin}m ago`;
                    const hintsHTML = `<span class="hints-pill ${(team.hintsUsed || 0) >= 2 ? 'maxed' : ''}">${team.hintsUsed || 0} / 2</span>`;

                    let lettersHTML = '<div style="display: flex;">';
                    for (let i = 0; i < 7; i++) {
                        const char = (team.letters || '')[i] || '';
                        lettersHTML += `<div class="dash-letter-box ${char ? 'active' : ''}">${char}</div>`;
                    }
                    lettersHTML += '</div>';

                    const rankClass = getRankClass(idx);

                    return `
                        <tr class="${team.isCompleted ? 'row-completed' : ''}">
                            <td>
                                <div class="rank-cell">
                                    <div class="rank-num ${rankClass}">${idx + 1}</div>
                                    <span class="team-name">${team.teamName || 'Unnamed Team'}</span>
                                </div>
                            </td>
                            <td>${stageBadge}</td>
                            <td>${lettersHTML}</td>
                            <td>${hintsHTML}</td>
                            <td class="time-cell">${timeStr}</td>
                        </tr>`;
                }).join('');

            } catch (err) {
                console.error("Dashboard error during layout parsing:", err);
            }
        });

        function updateStats(teams) {
            const total = teams.length;
            const done = teams.filter(t => t.isCompleted).length;
            const active = total - done;
            const avgStage = total > 0
                ? (teams.reduce((s, t) => s + (t.currentStage || 1), 0) / total).toFixed(1)
                : '—';

            const totalEl = document.getElementById('stat-total');
            const doneEl = document.getElementById('stat-done');
            const activeEl = document.getElementById('stat-active');
            const avgEl = document.getElementById('stat-avg');

            if (totalEl) totalEl.innerText = total;
            if (doneEl) doneEl.innerText = done;
            if (activeEl) activeEl.innerText = active;
            if (avgEl) avgEl.innerText = avgStage;
        }
    </script>
</body>
</html>
