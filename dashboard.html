<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Hunt - Admin Live Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0b0f19; color: #f1f5f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: #38bdf8; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .team-card { background: #141b2d; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; }
        .team-card.winner { border-color: #34d399; background: #064e3b; }
        .team-card.eliminated { border-color: #ef4444; background: #451a03; }
        .team-card.not-started { border-color: #334155; opacity: 0.6; }
        .team-title { font-size: 1.4rem; font-weight: bold; color: #ffffff; margin-bottom: 5px; }
        .team-id { font-size: 0.85rem; color: #64748b; font-family: monospace; letter-spacing: 0.5px; margin-bottom: 15px; }
        .stat-line { margin: 8px 0; font-size: 1rem; display: flex; justify-content: space-between; }
        .label { color: #94a3b8; }
        .val { font-weight: bold; }
        .stage-val { color: #38bdf8; }
        .strike-val { color: #f87171; }
        .status-tag { text-align: center; padding: 6px; font-weight: bold; border-radius: 4px; margin-top: 15px; font-size: 0.9rem; letter-spacing: 0.5px; }
        .eliminated-tag { background: #7f1d1d; color: #fca5a5; }
        .winner-tag { background: #047857; color: #a7f3d0; }
        .ns-tag { background: #1e293b; color: #94a3b8; font-weight: normal; }
    </style>

    <!-- Firebase SDK Modules -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>Jotun Office Hunt Live Dashboard</h1>
        <div style="font-size: 0.9rem; color: #34d399; font-weight: bold; letter-spacing: 1px;">● LIVE TRACKING WINDOW ACTIVE</div>
    </header>

    <div id="leaderboard-grid" class="grid">Connecting to live team tracking nodes...</div>
</div>

<script>
    // Master Mapping Registry - Links Access Codes to Official Jotun Brand Team Names
    const TEAM_NAMES = {
        "1fgx": "Team 1 - Majestic Blue",
        "2jkv": "Team 2 - Fenomastic Gold",
        "3bnd": "Team 3 - Jotashield Green",
        "4qws": "Team 4 - Lady Design Rose",
        "5zxt": "Team 5 - Woodshield Amber",
        "6mpl": "Team 6 - Royal Velvet",
        "7tyu": "Team 7 - Desert Coral",
        "8vfr": "Team 8 - Nordic Mist",
        "9lkj": "Team 9 - Eternal Emerald",
        "10pob": "Team 10 - Ocean Breeze",
        "11hgf": "Team 11 - Amber Glow",
        "12mnb": "Team 12 - Silk Touch Silver",
        "13cxz": "Team 13 - Tuscan Sun",
        "14oiu": "Team 14 - Urban Grey",
        "15ytg": "Team 15 - Midnight Sapphire"
    };

    // Firebase Database Reference Endpoint Configuration
    const firebaseConfig = {
        databaseURL: "https://jotunhunt2026-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    
    // Initialize application sequence
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Persistent WebSocket connection listener stream to Firebase
    db.ref("gameData/teams").on("value", (snapshot) => {
        const grid = document.getElementById('leaderboard-grid');
        const dbTeams = snapshot.val() || {};

        // Process data map structure across all 15 active teams
        const compiledTeams = [];
        
        Object.keys(TEAM_NAMES).forEach(code => {
            const liveData = dbTeams[code] || null;
            compiledTeams.push({
                code: code,
                name: TEAM_NAMES[code],
                stage: liveData ? (parseInt(liveData.stage) || 0) : 0,
                strikes: liveData ? (parseInt(liveData.strikes) || 0) : 0,
                hasStarted: liveData !== null
            });
        });

        // Sorting Engine: Non-eliminated leaders top the board, unstarted sit mid, eliminated drop bottom
        compiledTeams.sort((a, b) => {
            const aElim = a.strikes >= 5 ? 1 : 0;
            const bElim = b.strikes >= 5 ? 1 : 0;
            if (aElim !== bElim) return aElim - bElim;

            if (b.stage !== a.stage) return b.stage - a.stage;
            if (a.strikes !== b.strikes) return a.strikes - b.strikes;
            return b.hasStarted - a.hasStarted;
        });

        // Render layout updates to interface elements
        grid.innerHTML = "";
        
        compiledTeams.forEach(team => {
            let cardClass = "team-card";
            let statusTagHtml = "";
            
            if (!team.hasStarted) {
                cardClass += " not-started";
                statusTagHtml = `<div class="status-tag ns-tag">💤 Awaiting Login</div>`;
            } else if (team.strikes >= 5) {
                cardClass += " eliminated";
                statusTagHtml = `<div class="status-tag eliminated-tag">❌ ELIMINATED</div>`;
            } else if (team.stage >= 5) {
                cardClass += " winner";
                statusTagHtml = `<div class="status-tag winner-tag">🏆 FINISHED (VICTORY)</div>`;
            } else {
                statusTagHtml = `<div class="status-tag" style="background:#1e293b; color:#38bdf8;">🏃 Active Racing</div>`;
            }

            grid.innerHTML += `
                <div class="${cardClass}">
                    <div class="team-title">${team.name}</div>
                    <div class="team-id">Access Node Code: ${team.code}</div>
                    <div class="stat-line">
                        <span class="label">Current Stage:</span>
                        <span class="val stage-val">${team.stage} / 5</span>
                    </div>
                    <div class="stat-line">
                        <span class="label">Strikes Logged:</span>
                        <span class="val strike-val">${team.strikes} / 5</span>
                    </div>
                    ${statusTagHtml}
                </div>
            `;
        });
    });
</script>
</body>
</html>
