<script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsX-ExampLEKeySpAcE2026_Fix",
            authDomain: "jotunhunt2026.firebaseapp.com",
            projectId: "jotunhunt2026",
            databaseURL: "https://jotunhunt2026-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function getRankClass(idx) {
            if (idx === 0) return 'gold';
            if (idx === 1) return 'silver';
            if (idx === 2) return 'bronze';
            return '';
        }

        // ── TARGET THE EXACT NODE USED BY BACKEND ──
        db.ref('gameData/teams').on('value', (snapshot) => {
            const data = snapshot.val();
            const target = document.getElementById('leaderboard-stream-target');

            if (!data) {
                target.innerHTML = `
                    <tr class="empty-state">
                        <td colspan="5">⏳ Waiting for teams to connect…</td>
                    </tr>`;
                updateStats([]);
                return;
            }

            // Convert to sorting layout array
            const teams = Object.keys(data).map(token => ({
                token,
                ...data[token]
            }));

            // Sort: Completed first (by time), then by highest stage, then by least hints
            teams.sort((a, b) => {
                if (a.isCompleted && !b.isCompleted) return -1;
                if (!a.isCompleted && b.isCompleted) return 1;
                if (a.currentStage !== b.currentStage) return b.currentStage - a.currentStage;
                return (a.hintsUsed || 0) - (b.hintsUsed || 0);
            });

            updateStats(teams);

            target.innerHTML = teams.map((team, idx) => {
                let stageBadge = `<span class="badge badge-stage">Stage ${team.currentStage} / 7</span>`;
                if (team.isCompleted) {
                    stageBadge = `<span class="badge badge-done">🏁 Finished</span>`;
                }

                const elapsedMin = Math.max(0, Math.floor((Date.now() - (team.lastActive || Date.now())) / 60000));
                const timeStr = elapsedMin === 0 ? 'Just now' : `${elapsedMin}m ago`;

                const hintsHTML = `<span class="hints-pill ${team.hintsUsed >= 2 ? 'maxed' : ''}">${team.hintsUsed || 0} / 2</span>`;

                let lettersHTML = '';
                for (let i = 0; i < 7; i++) {
                    const char = (team.letters || '')[i] || '';
                    lettersHTML += `<div class="dash-letter-box ${char ? 'active' : ''}">${char}</div>`;
                }

                const rankClass = getRankClass(idx);

                return `
                    <tr class="${team.isCompleted ? 'row-completed' : ''}">
                        <td>
                            <div class="rank-cell">
                                <div class="rank-num ${rankClass}">${idx + 1}</div>
                                <span class="team-name">${team.teamName}</span>
                            </div>
                        </td>
                        <td>${stageBadge}</td>
                        <td><div style="display:flex; gap:3px;">${lettersHTML}</div></td>
                        <td>${hintsHTML}</td>
                        <td class="time-cell">${timeStr}</td>
                    </tr>`;
            }).join('');
        });

        function updateStats(teams) {
            const total = teams.length;
            const done = teams.filter(t => t.isCompleted).length;
            const active = total - done;
            const avgStage = total > 0
                ? (teams.reduce((s, t) => s + (t.currentStage || 1), 0) / total).toFixed(1)
                : '—';

            document.getElementById('stat-total').innerText = total || '—';
            document.getElementById('stat-done').innerText = done || '—';
            document.getElementById('stat-active').innerText = active || '—';
            document.getElementById('stat-avg').innerText = total > 0 ? avgStage : '—';
        }
    </script>
