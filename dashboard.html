<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Hunt 2026 · Analytics</title>
    <!-- Firebase Legacy Compat Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --jotun-navy: #002D72;
            --jotun-navy-deep: #001A45;
            --jotun-navy-mid: #00408A;
            --jotun-red: #C8102E;
            --jotun-green: #10B981;
            --jotun-gold: #F0A500;
            --surface: #F4F7FC;
            --surface-2: #EBF0FA;
            --text-main: #1E293B;
            --text-sub: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--surface); color: var(--text-main); padding: 30px; min-height: 100vh; position: relative; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 3px solid var(--jotun-navy); padding-bottom: 15px; }
        h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px; color: var(--jotun-navy); letter-spacing: 0.5px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,45,114,0.04); border: 1px solid rgba(0,45,114,0.06); text-align: center; }
        .stat-card h3 { font-size: 13px; text-transform: uppercase; color: var(--text-sub); margin-bottom: 8px; letter-spacing: 0.5px; }
        .stat-card p { font-size: 28px; font-weight: 700; color: var(--jotun-navy-deep); }
        
        .table-container { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,45,114,0.05); border: 1px solid rgba(0,45,114,0.06); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--jotun-navy-deep); color: white; padding: 16px 20px; font-size: 13px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        td { padding: 18px 20px; border-bottom: 1px solid var(--surface-2); font-size: 15px; font-weight: 500; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        
        .rank-num { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-sub); }
        .rank-num.gold { background: #FFDF00; color: #8A6D00; }
        .rank-num.silver { background: #E4E4E4; color: #555555; }
        .rank-num.bronze { background: #CD7F32; color: #FFFFFF; }
        .team-name { font-weight: 600; color: var(--jotun-navy-deep); }
        
        .progress-wrapper { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 300px; }
        .progress-track { background: var(--surface-2); height: 8px; border-radius: 4px; flex-grow: 1; overflow: hidden; }
        .progress-bar { background: var(--jotun-navy); height: 100%; width: 0%; transition: width 0.4s ease; border-radius: 4px; }
        .progress-bar.finished { background: var(--jotun-green); }
        .progress-text { font-size: 14px; font-weight: 700; color: var(--jotun-navy-deep); min-width: 45px; text-align: right; }
        
        .row-greyed { opacity: 0.4; background-color: #FAFAFA; filter: grayscale(40%); }
        .row-completed { background-color: rgba(16,185,129,0.02); }
        .time-cell { color: var(--text-sub); font-size: 13px; }

        /* ── WINNER TAKEOVER ── */
        .dashboard-content {
            transition: filter 0.6s ease, opacity 0.6s ease;
        }
        .dashboard-content.faded {
            filter: blur(5px) grayscale(50%);
            opacity: 0.35;
            pointer-events: none;
            user-select: none;
        }
        .winner-takeover {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 5000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            background: radial-gradient(circle at center, rgba(0,45,114,0.08) 0%, rgba(244,247,252,0.4) 70%);
        }
        .winner-takeover.active { display: flex; }
        .winner-crown {
            font-size: 90px;
            animation: crownDrop 0.8s cubic-bezier(0.175,0.885,0.32,1.275);
            filter: drop-shadow(0 8px 24px rgba(240,165,0,0.4));
        }
        @keyframes crownDrop {
            0% { transform: translateY(-60px) scale(0.5) rotate(-10deg); opacity: 0; }
            60% { transform: translateY(8px) scale(1.1) rotate(4deg); }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }
        .winner-eyebrow {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--jotun-gold);
            animation: winnerFadeIn 0.6s ease 0.2s both;
        }
        .winner-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 64px;
            font-weight: 800;
            color: var(--jotun-navy-deep);
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 4px 30px rgba(0,45,114,0.15);
            animation: winnerFadeIn 0.6s ease 0.35s both;
            max-width: 90vw;
        }
        .winner-subtitle {
            font-size: 16px;
            color: var(--text-sub);
            font-weight: 500;
            animation: winnerFadeIn 0.6s ease 0.5s both;
        }
        @keyframes winnerFadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .winner-confetti-canvas {
            position: fixed;
            inset: 0;
            z-index: 4999;
            pointer-events: none;
        }


        /* ── JOTUN LIVE RACE DASHBOARD REFRESH ── */
        body {
            padding: 34px;
            background:
                radial-gradient(circle at 10% 10%, rgba(200,16,46,0.18), transparent 26%),
                radial-gradient(circle at 88% 16%, rgba(240,165,0,0.23), transparent 26%),
                radial-gradient(circle at 50% 100%, rgba(0,45,114,0.20), transparent 34%),
                linear-gradient(135deg, #f7f9ff 0%, #edf3ff 50%, #fff8ed 100%);
            overflow-x: hidden;
        }
        body::before, body::after {
            content: '';
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 42% 58% 67% 33% / 43% 37% 63% 57%;
            pointer-events: none;
            opacity: 0.13;
            z-index: -1;
            animation: dashBlob 14s ease-in-out infinite;
        }
        body::before { background: var(--jotun-navy); left: -100px; top: 160px; }
        body::after { background: var(--jotun-red); right: -115px; bottom: 90px; animation-delay: -6s; }
        @keyframes dashBlob {
            0%,100% { transform: translate3d(0,0,0) scale(1) rotate(0deg); }
            50% { transform: translate3d(24px,-18px,0) scale(1.08) rotate(12deg); }
        }
        header {
            border: 0;
            padding: 28px 30px;
            border-radius: 28px;
            color: white;
            background:
                radial-gradient(circle at 90% 0%, rgba(240,165,0,0.48), transparent 28%),
                radial-gradient(circle at 0% 100%, rgba(200,16,46,0.34), transparent 32%),
                linear-gradient(135deg, #001A45, #002D72 58%, #00408A);
            box-shadow: 0 22px 60px rgba(0,45,114,0.20);
        }
        h1 { color: white; font-size: 44px; letter-spacing: 1px; }
        header::after {
            content: 'LIVE RACE CONTROL';
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: rgba(255,255,255,0.66);
        }
        .stats-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
        .stat-card {
            background: rgba(255,255,255,0.84);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 24px;
            box-shadow: 0 16px 44px rgba(0,45,114,0.11);
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            right: -25px;
            top: -28px;
            border-radius: 50%;
            background: rgba(240,165,0,0.18);
        }
        .stat-card p { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; }
        .table-container {
            border-radius: 28px;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.72);
            box-shadow: 0 24px 70px rgba(0,45,114,0.14);
            overflow-x: auto;
        }
        table { min-width: 860px; }
        th {
            background: linear-gradient(135deg, #001A45, #002D72);
            padding: 20px 22px;
        }
        td { padding: 20px 22px; font-size: 17px; }
        tr { transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease; }
        tbody tr:hover { background: rgba(0,45,114,0.035); transform: scale(1.003); }
        .rank-wrap { display:flex; align-items:center; gap:9px; }
        .rank-num {
            width: 36px;
            height: 36px;
            font-size: 14px;
            box-shadow: inset 0 0 0 1px rgba(0,45,114,0.08);
        }
        .rank-delta { font-size: 12px; font-weight: 900; min-width: 24px; }
        .rank-delta.up { color: var(--jotun-green); }
        .rank-delta.down { color: var(--jotun-red); }
        .rank-delta.same { color: var(--text-sub); }
        .team-line { display:flex; align-items:center; gap:10px; }
        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--jotun-green);
            box-shadow: 0 0 0 0 rgba(16,185,129,0.45);
            animation: livePulse 1.6s ease-in-out infinite;
            flex: 0 0 auto;
        }
        .live-dot.idle { background: #CBD5E1; animation: none; box-shadow: none; }
        @keyframes livePulse {
            0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.45); }
            70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }
        .progress-wrapper { max-width: 420px; flex-direction: column; align-items: stretch; gap: 8px; }
        .progress-topline { display:flex; align-items:center; gap:12px; }
        .progress-track {
            height: 13px;
            border-radius: 100px;
            background: #E5ECF8;
            box-shadow: inset 0 1px 3px rgba(0,45,114,0.12);
        }
        .progress-bar {
            border-radius: 100px;
            background: linear-gradient(90deg, #C8102E, #F0A500, #002D72);
            box-shadow: 0 0 18px rgba(0,45,114,0.18);
        }
        .progress-bar.finished { background: linear-gradient(90deg, #10B981, #F0A500); }
        .race-track {
            position: relative;
            height: 18px;
            border-radius: 100px;
            background: repeating-linear-gradient(90deg, rgba(0,45,114,0.08) 0 10px, rgba(0,45,114,0.03) 10px 20px);
            overflow: hidden;
        }
        .race-marker {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 15px;
            transition: left 0.45s ease;
        }
        .row-completed { background: rgba(16,185,129,0.055); }
        .row-greyed { opacity: 0.48; filter: grayscale(30%); }
        .time-cell { font-size: 14px; font-weight: 700; }
        .winner-takeover {
            background:
                radial-gradient(circle at 26% 22%, rgba(240,165,0,0.42), transparent 28%),
                radial-gradient(circle at 76% 72%, rgba(200,16,46,0.45), transparent 30%),
                linear-gradient(135deg, rgba(0,26,69,0.94), rgba(0,45,114,0.90));
        }
        .winner-crown { font-size: 112px; }
        .winner-eyebrow { color: #fff; letter-spacing: 4px; }
        .winner-name { color: var(--jotun-gold); font-size: 82px; text-shadow: 0 0 44px rgba(240,165,0,0.35); }
        .winner-subtitle { color: rgba(255,255,255,0.78); font-weight: 700; }
        @media (min-width: 1200px) {
            body.projector-mode td { font-size: 19px; }
            body.projector-mode th { font-size: 15px; }
            body.projector-mode .stat-card p { font-size: 52px; }
        }
        @media (max-width: 760px) {
            body { padding: 16px; }
            header { padding: 22px; align-items:flex-start; flex-direction: column; gap: 8px; }
            h1 { font-size: 34px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .stat-card { padding: 16px; }
        }

    </style>
</head>
<body class="projector-mode">

    <canvas id="winner-confetti-canvas" class="winner-confetti-canvas"></canvas>

    <div class="winner-takeover" id="winner-takeover">
        <div class="winner-crown">👑</div>
        <div class="winner-eyebrow">Treasure Found</div>
        <div class="winner-name" id="winner-name-display"></div>
        <div class="winner-subtitle">The Color of Victory</div>
    </div>

    <div class="dashboard-content" id="dashboard-content">
        <header>
            <h1>An Inauguration to a Colorful Restart</h1>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><h3>Total Teams</h3><p id="stat-total">20</p></div>
            <div class="stat-card"><h3>Average Progress</h3><p id="stat-avg">0%</p></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 8%;">Rank</th>
                        <th style="width: 42%;">Team Identity</th>
                        <th style="width: 35%;">Game Progress</th>
                        <th style="width: 15%;">Last Activity</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-stream-target">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Exact Team Master Roster explicitly linked to its internal backend configuration mapping
        const TEAM_MASTER_ROSTER = {
          "j7x2": { name: "ROYAL BLUE",          cohort: 1 },
          "m3kw": { name: "MINTY BREEZE",         cohort: 1 },
          "r9nt": { name: "MOROCCAN MIST",        cohort: 1 },
          "w4qb": { name: "WOODSMOKE",            cohort: 1 },
          "v6lp": { name: "MEDITERRANEAN OLIVE",  cohort: 2 },
          "t8cz": { name: "TRAVERTINE CAIRO",     cohort: 2 },
          "e2ys": { name: "TIMELESS",             cohort: 2 },
          "u5fh": { name: "PURE OCEAN",           cohort: 2 },
          "n1gd": { name: "FOREVER JUNGLE",       cohort: 3 },
          "d0rv": { name: "DREAMY DESERT",        cohort: 3 },
          "i4mo": { name: "IVORY TOAST",          cohort: 3 },
          "s6jt": { name: "STONE GREY",           cohort: 3 },
          "p2xn": { name: "PASTEL MINT",          cohort: 4 },
          "b9ae": { name: "URBAN MIST",           cohort: 4 },
          "q3wk": { name: "PERSIAN PEARL",        cohort: 4 },
          "f7cv": { name: "DOVE GREY",            cohort: 4 },
          "g5rl": { name: "GOLDEN LILY",          cohort: 5 },
          "h8uz": { name: "EARTHSCAPE",           cohort: 5 },
          "c1mb": { name: "BRIGHT SIENNA",        cohort: 5 },
          "k0yd": { name: "MINIMALIST",           cohort: 5 }
        };

        // Exact puzzle sequences for each cohort from your backend configuration
        const COHORT_SEQUENCES = {
          1: ["CW", "BP", "MR", "LR"],
          2: ["BP", "CW", "LR", "MR"],
          3: ["MR", "CW", "BP", "LR"],
          4: ["MR", "LR","CW", "BP"],
          5: ["LR", "BP", "MR", "CW"]
        };

        // Custom puzzle weight distributions provided by you
        const WEIGHTS = {
          "IDENTITY": 10, // Team name entry
          "CW": 25,       // Crossword
          "BP": 20,       // Blueprint
          "MR": 20,       // Murdle
          "LR": 15        // Letter route
        };

        const firebaseConfig = {
            databaseURL: "https://jotunhunt2026-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let winnerShown = false;
        let previousRanks = {};
        let currentWinnerToken = null;
        let progressFirstSeen = {};


        function rememberProgressPoint(token, progressPct) {
            const key = `${token}:${progressPct}`;
            if (!progressFirstSeen[key]) progressFirstSeen[key] = Date.now();
            return progressFirstSeen[key];
        }

        function getRankClass(idx) {
            if (idx === 0) return 'gold';
            if (idx === 1) return 'silver';
            if (idx === 2) return 'bronze';
            return '';
        }

        // Dynamically processes and calculates customized percentage values based on team cohort orders
        function calculateWeightedProgress(cohortNum, currentStage, isCompleted) {
            if (isCompleted) return 100;
            if (currentStage === 1) return 0;

            let percentageSum = WEIGHTS["IDENTITY"]; // 10% awarded immediately for finishing registration

            const sequence = COHORT_SEQUENCES[cohortNum];
            if (!sequence) return percentageSum;

            const completedCount = Math.min(currentStage - 2, sequence.length);
            for (let i = 0; i < completedCount; i++) {
                const puzzleKey = sequence[i];
                if (WEIGHTS[puzzleKey]) {
                    percentageSum += WEIGHTS[puzzleKey];
                }
            }

            return Math.round(percentageSum / 10) * 10;
        }

        // ── WINNER WATCHER ──
        db.ref('gameData/winner').on('value', (snapshot) => {
            const winnerData = snapshot.val();
            const takeover = document.getElementById('winner-takeover');
            const content = document.getElementById('dashboard-content');

            if (winnerData && winnerData.name) {
                currentWinnerToken = winnerData.token || null;
                document.getElementById('winner-name-display').innerText = winnerData.name;
                takeover.classList.add('active');
                content.classList.add('faded');
                if (!winnerShown) {
                    winnerShown = true;
                    launchWinnerConfetti();
                }
            } else {
                takeover.classList.remove('active');
                content.classList.remove('faded');
                winnerShown = false;
                currentWinnerToken = null;
            }
        });

        db.ref('gameData/teams').on('value', (snapshot) => {
            try {
                const liveData = snapshot.val() || {};
                const target = document.getElementById('leaderboard-stream-target');
                if (!target) return;

                // Loop cleanly over the token registry array to build the precise lineup metrics
                const tokensArray = Object.keys(TEAM_MASTER_ROSTER);
                const fullLineup = tokensArray.map((token, index) => {
                    const rosterInfo = TEAM_MASTER_ROSTER[token];
                    const match = liveData[token];

                    if (match) {
                        const pct = calculateWeightedProgress(rosterInfo.cohort, match.currentStage || 1, match.isCompleted || false);
                        
                        // Mask the name with a generic placeholder if they are still on Stage 1 (entering identity)
                        const dynamicLabel = (match.currentStage > 1) ? rosterInfo.name : `Team ${index + 1} (Joining...)`;

                        return {
                            token: token,
                            isRegistered: (match.currentStage > 1), 
                            teamName: rosterInfo.name,
                            currentStage: match.currentStage || 1,
                            isCompleted: match.isCompleted || false,
                            lastActive: match.lastActive || null,
                            progressPct: pct,
                            progressFirstSeen: rememberProgressPoint(token, pct),
                            displayLabel: dynamicLabel
                        };
                    } else {
                        // Display uninitialized state safely using standard layout values
                        return {
                            token: token,
                            isRegistered: false,
                            teamName: `Team ${index + 1}`,
                            currentStage: 1,
                            isCompleted: false,
                            lastActive: null,
                            progressPct: 0,
                            progressFirstSeen: rememberProgressPoint(token, 0),
                            displayLabel: `Team ${index + 1} (Not Connected)`
                        };
                    }
                });

                // Leaderboard Sorting Rule context: Highest percentage first, ties resolved by latest activity timestamp
                fullLineup.sort((a, b) => {
                    if (b.progressPct !== a.progressPct) {
                        return b.progressPct - a.progressPct;
                    }
                    return (a.progressFirstSeen || Infinity) - (b.progressFirstSeen || Infinity);
                });

                updateGlobalAnalytics(fullLineup);

                target.innerHTML = fullLineup.map((team, idx) => {
                    const rankClass = getRankClass(idx);
                    let rowModifier = "";
                    
                    if (!team.isRegistered) {
                        rowModifier = "row-greyed";
                    } else if (team.isCompleted) {
                        rowModifier = "row-completed";
                    }

                    let timeStr = "—";
                    if (team.lastActive) {
                        const elapsedMin = Math.max(0, Math.floor((Date.now() - team.lastActive) / 60000));
                        timeStr = elapsedMin === 0 ? 'Just now' : `${elapsedMin}m ago`;
                    }

                    const isDoneClass = team.isCompleted ? "finished" : "";

                    const oldRank = previousRanks[team.token];
                    let deltaClass = "same";
                    let deltaText = "—";
                    if (oldRank) {
                        const change = oldRank - (idx + 1);
                        if (change > 0) { deltaClass = "up"; deltaText = `▲${change}`; }
                        else if (change < 0) { deltaClass = "down"; deltaText = `▼${Math.abs(change)}`; }
                    }
                    const recentlyActive = team.lastActive && (Date.now() - team.lastActive) < 60000;
                    const markerLeft = Math.max(2, Math.min(98, team.progressPct));
                    const winnerAttr = currentWinnerToken && currentWinnerToken === team.token ? ' data-winner="true"' : '';

                    return `
                        <tr class="${rowModifier}" data-team-token="${team.token}"${winnerAttr}>
                            <td>
                                <div class="rank-wrap">
                                    <div class="rank-num ${rankClass}">${idx + 1}</div>
                                    <span class="rank-delta ${deltaClass}">${deltaText}</span>
                                </div>
                            </td>
                            <td>
                                <div class="team-line"><span class="live-dot ${recentlyActive ? '' : 'idle'}"></span><span class="team-name">${team.displayLabel}</span></div>
                            </td>
                            <td>
                                <div class="progress-wrapper">
                                    <div class="progress-topline">
                                        <div class="progress-track">
                                            <div class="progress-bar ${isDoneClass}" style="width: ${team.progressPct}%;"></div>
                                        </div>
                                        <div class="progress-text">${team.progressPct}%</div>
                                    </div>
                                    <div class="race-track"><span class="race-marker" style="left:${markerLeft}%">🎨</span></div>
                                </div>
                            </td>
                            <td class="time-cell">${timeStr}</td>
                        </tr>`;
                }).join('');

                previousRanks = Object.fromEntries(fullLineup.map((team, idx) => [team.token, idx + 1]));
                if (currentWinnerToken) {
                    const winnerRow = document.querySelector(`tr[data-team-token="${currentWinnerToken}"]`);
                    if (winnerRow) winnerRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

            } catch (err) {
                console.error("Dashboard metric rendering engine crash:", err);
            }
        });

        function updateGlobalAnalytics(lineup) {
            const total = 20;
            const totalSum = lineup.reduce((sum, t) => sum + t.progressPct, 0);
            const avgProgress = (totalSum / total).toFixed(0);

            const totalEl = document.getElementById('stat-total');
            const avgEl = document.getElementById('stat-avg');

            if (totalEl) totalEl.innerText = total;
            if (avgEl) avgEl.innerText = `${avgProgress}%`;
        }

        // ── CONFETTI ──
        function launchWinnerConfetti() {
            const canvas = document.getElementById('winner-confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const COLORS = ['#F0A500','#C8102E','#002D72','#10B981','#a855f7','#FFDF00'];
            const pieces = Array.from({ length: 260 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 5 + 3,
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                angle: Math.random() * 360,
                spin: (Math.random() - 0.5) * 4,
                vx: (Math.random() - 0.5) * 3,
                vy: Math.random() * 3 + 1.5
            }));

            let stopTime = Date.now() + 8000;

            function frame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.angle += p.spin;
                    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    ctx.save();
                    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
                    ctx.rotate(p.angle * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });
                if (Date.now() < stopTime) {
                    requestAnimationFrame(frame);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            frame();
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('winner-confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
