<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Hunt 2026 · Analytics</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --jotun-navy: #002D72;
            --jotun-navy-deep: #001A45;
            --jotun-navy-mid: #00408A;
            --jotun-red: #C8102E;
            --jotun-green: #10B981;
            --jotun-gold: #F0A500;
            --surface: #F4F7FC;
            --surface-2: #E9EDF5;
            --white: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #475569;
            --border: #E2E8F0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 4px 6px -1px rgba(0,45,114,0.05);
            --shadow-md: 0 10px 25px -5px rgba(0,45,114,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--surface);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar Layout Configuration */
        nav {
            background-color: var(--jotun-navy-deep);
            color: var(--white);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--jotun-red);
            box-shadow: var(--shadow-sm);
        }

        .brand-block h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .brand-block h1 span { color: var(--jotun-gold); }
        .brand-block p {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94A3B8;
            margin-top: -2px;
        }

        .server-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.08);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--jotun-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--jotun-green);
            animation: pulseGlow 1.8s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* Main Tracking Layout Structures Workspace Grid */
        main {
            flex: 1;
            padding: 32px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Leaderboard and Winner Deck Layout Presentation */
        .podium-section {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 160px;
        }
        .podium-section::before {
            content: '';
            position: absolute;
            top:0; left:0; width:100%; height:4px;
            background: linear-gradient(90deg, var(--jotun-gold), #FCD34D, var(--jotun-gold));
        }

        .winner-banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            animation: scaleIntro 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes scaleIntro {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .crown { font-size: 42px; margin-bottom: -4px; animation: wobble 2.5s infinite ease-in-out; }
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        .no-winner {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
            font-style: italic;
        }

        /* Analytical Matrix Cards Grid Block */
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .team-card {
            background-color: var(--white);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .team-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            background-color: #F8FAFC;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .team-identity-row h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--jotun-navy-deep);
        }
        .team-identity-row span {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            background-color: var(--surface-2);
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 2px;
            display: inline-block;
        }

        .stage-indicator {
            background: linear-gradient(135deg, var(--jotun-navy), var(--jotun-navy-mid));
            color: var(--white);
            padding: 6px 14px;
            border-radius: 30px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,45,114,0.15);
        }
        .stage-complete-badge {
            background: linear-gradient(135deg, var(--jotun-green), #059669);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        /* Progress Processing Bar Custom Structural Component */
        .progress-track-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .bar-outer {
            width: 100%;
            height: 8px;
            background-color: var(--surface-2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .bar-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--jotun-navy), var(--jotun-navy-mid));
            border-radius: 10px;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bar-inner-finished {
            background: linear-gradient(90deg, var(--jotun-green), #34D399);
        }

        /* Statistics counters rows layout grids configuration markers */
        .stats-summary-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: auto;
        }
        .metric-mini-box {
            background-color: #F8FAFC;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-mini-box p {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .metric-mini-box h5 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 4px;
        }

        .card-footer {
            background-color: #F8FAFC;
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Overlay Full Window Overlay Canvas celebration component */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <nav>
        <div class="brand-block">
            <h1>Jotun Hunt <span>2026</span></h1>
            <p>Live Monitoring Analytics Console</p>
        </div>
        <div class="server-status">
            <div class="pulse-dot"></div>
            <span>Database Connected (Asia-Southeast1)</span>
        </div>
    </nav>

    <main>
        
        <section class="podium-section">
            <div id="champion-deck-viewport">
                <div class="no-winner">Awaiting final decryption validation arrays clearance from participating tactical operational groups...</div>
            </div>
        </section>

        <section class="matrix-grid" id="teams-matrix-container"></section>

    </main>

    <script>
        // Target Region Configuration Pointer Variables Mapping Initialization
        const firebaseConfig = {
            databaseURL: "https://jotunhunt2026-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        // Initialize regional applications matrix mapping context logs parameters
        admin.initializeApp(firebaseConfig);
        const database = admin.database();

        // Structural reference configurations pointers definitions collections
        const COHORT_ROUTING_MAP = {
            'RED74': 'ALPHA', 'BLU21': 'ALPHA', 'GRN89': 'ALPHA',
            'YLW55': 'BETA',  'ORG33': 'BETA',  'PRP12': 'BETA',
            'BLK99': 'GAMMA', 'WHT44': 'GAMMA', 'SLV66': 'GAMMA',
            'GOL77': 'DELTA', 'BRZ22': 'DELTA', 'COP88': 'DELTA'
        };

        let trackedWinnerStateTokenId = null;

        // Initialize database listeners loops tracking updates routines hooks bindings allocations
        database.ref("gameData").on("value", (snapshot) => {
            const globalPackagePayloadData = snapshot.val() || {};
            const dictionaryTeamsCollection = globalPackagePayloadData.teams || {};
            const declaredWinnerProfile = globalPackagePayloadData.winner || null;

            evaluateWinnerPodiumStateRender(declaredWinnerProfile);
            renderOperationalTeamsMatrix(dictionaryTeamsCollection);
        });

        function evaluateWinnerPodiumStateRender(winnerObjectDataNode) {
            const viewport = document.getElementById('champion-deck-viewport');
            
            if (!winnerObjectDataNode) {
                trackedWinnerStateTokenId = null;
                viewport.innerHTML = `<div class="no-winner">Awaiting final decryption validation arrays clearance from participating tactical operational groups...</div>`;
                return;
            }

            // Check whether fireworks particle arrays should execute during new transaction instances configurations events
            if (trackedWinnerStateTokenId !== winnerObjectDataNode.token) {
                trackedWinnerStateTokenId = winnerObjectDataNode.token;
                triggerVictoryConfettiStormEffect();
            }

            const formatTime = new Date(winnerObjectDataNode.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            viewport.innerHTML = `
                <div class="winner-banner">
                    <div class="crown">👑</div>
                    <h2 style="font-family:'Barlow Condensed', sans-serif; font-size:32px; font-weight:800; color:var(--jotun-navy-deep); text-transform:uppercase; letter-spacing:-0.5px;">
                        ${winnerObjectDataNode.name} Claims Victory!
                    </h2>
                    <p style="font-size:13px; font-weight:600; color:var(--jotun-red); text-transform:uppercase; letter-spacing:1px; margin-top:2px;">
                        Final Objective Decoded and Logged Safely at ${formatTime}
                    </p>
                </div>`;
        }

        function renderOperationalTeamsMatrix(teamsDatasetCollectionObject) {
            const gridContainer = document.getElementById('teams-matrix-container');
            gridContainer.innerHTML = ""; // Wipe presentation viewport canvas frames layouts grids tracking elements array updates

            // Use alphanumeric validation sorting processing keys sequences definitions operations
            const entriesSortedKeysArray = Object.keys(teamsDatasetCollectionObject).sort();

            if (entriesSortedKeysArray.length === 0) {
                gridContainer.innerHTML = `
                    <div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted); font-size:14px; font-weight:500;">
                        No active operational units registered inside telemetry nodes parameters tracking logs paths.
                    </div>`;
                return;
            }

            entriesSortedKeysArray.forEach((tokenKey) => {
                const teamNodeData = teamsDatasetCollectionObject[tokenKey];
                
                // Safe lookup parameters configurations logic elements processing maps wrappers
                const assignedCohort = COHORT_ROUTING_MAP[tokenKey] || "UNKNOWN";
                const currentStageIndex = teamNodeData.currentStage || 1;
                const totalHintsUsed = teamNodeData.hintsUsed || 0;
                const completionFlag = teamNodeData.isCompleted || false;
                const epochLastActive = teamNodeData.lastActive || null;

                // Calculate mathematical percentage operations layouts variables references bounds
                // Stage ranges 1 to 6 mapped linearly across percentage frames components elements boundaries parameters
                let processPercentageValue = Math.min(100, Math.floor(((currentStageIndex - 1) / 5) * 100));
                if (completionFlag) processPercentageValue = 100;

                const readableLastActiveTime = epochLastActive ? new Date(epochLastActive).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'N/A';

                // Construct and assign dynamic HTML block components node layout configurations structures arrays
                const cardElementWrapper = document.createElement('div');
                cardElementWrapper.className = "team-card";

                cardElementWrapper.innerHTML = `
                    <div class="card-header">
                        <div class="team-identity-row">
                            <h3>${resolveTeamFriendlyName(tokenKey)}</h3>
                            <span>Token ID: ${tokenKey} · Route: ${assignedCohort}</span>
                        </div>
                        <div class="stage-indicator ${completionFlag ? 'stage-complete-badge' : ''}">
                            ${completionFlag ? 'FINISH' : `STAGE ${currentStageIndex}`}
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="progress-track-wrapper">
                            <div class="progress-meta">
                                <span>Mission Convergence</span>
                                <span>${processPercentageValue}%</span>
                            </div>
                            <div class="bar-outer">
                                <div class="bar-inner ${completionFlag ? 'bar-inner-finished' : ''}" style="width: ${processPercentageValue}%;"></div>
                            </div>
                        </div>
                        <div class="stats-summary-row">
                            <div class="metric-mini-box">
                                <p>Hints Engaged</p>
                                <h5 style="color: ${totalHintsUsed >= 2 ? 'var(--jotun-red)' : 'var(--text-main)'};">${totalHintsUsed} / 2</h5>
                            </div>
                            <div class="metric-mini-box">
                                <p>Last Log Telemetry</p>
                                <h5>${readableLastActiveTime}</h5>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span>Tracking Status: ${completionFlag ? 'Completed Run' : 'Active Field Operations'}</span>
                        <span style="font-weight:600; color:var(--jotun-navy); font-size:10px;">JOTUN HUNT 2026</span>
                    </div>`;

                gridContainer.appendChild(cardElementWrapper);
            });
        }

        function resolveTeamFriendlyName(tokenStringKeyId) {
            const mapping = {
                'RED74': 'Team Crimson', 'BLU21': 'Team Azure',   'GRN89': 'Team Emerald',
                'YLW55': 'Team Amber',   'ORG33': 'Team Tiger',   'PRP12': 'Team Orchid',
                'BLK99': 'Team Shadow',  'WHT44': 'Team Frost',   'SLV66': 'Team Mercury',
                'GOL77': 'Team Gold',    'BRZ22': 'Team Bronze',  'COP88': 'Team Copper'
            };
            return mapping[tokenStringKeyId] || `Unit ${tokenStringKeyId}`;
        }

        function triggerVictoryConfettiStormEffect() {
            const canvas = document.getElementById("confetti-canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            const COLORS = ['#002D72', '#C8102E', '#F0A500', '#10B981', '#3B82F6', '#EC4899'];
            const pieces = Array.from({ length: 120 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 8 + 6,
                h: Math.random() * 12 + 8,
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                angle: Math.random() * 360,
                spin: (Math.random() - 0.5) * 4,
                vx: (Math.random() - 0.5) * 3,
                vy: Math.random() * 3 + 1.5
            }));

            let stopTime = Date.now() + 8000;

            function frame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.angle += p.spin;
                    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    ctx.save();
                    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
                    ctx.rotate(p.angle * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });
                if (Date.now() < stopTime) {
                    requestAnimationFrame(frame);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            frame();
        }
    </script>
</body>
</html>
