<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Hunt 2026 · Analytics</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --jotun-navy: #002D72;
            --jotun-navy-deep: #001A45;
            --jotun-navy-mid: #00408A;
            --jotun-red: #C8102E;
            --jotun-green: #10B981;
            --surface: #F4F7FC;
            --surface-2: #EBF0FA;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --radius-lg: 16px;
            --radius-md: 10px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--surface); color: var(--text-main); min-height: 100vh; padding: 40px 24px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
        .brand-block { display: flex; align-items: center; gap: 16px; }
        .logo { width: 44px; height: 44px; background: var(--jotun-red); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; }
        h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; color: var(--jotun-navy); }
        .subtitle { font-size: 14px; color: var(--text-muted); margin-top: 2px; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; box-shadow: 0 4px 12px rgba(0,45,114,0.03); }
        .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .stat-value { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; color: var(--jotun-navy); margin-top: 4px; }

        .table-card { background: white; border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 10px 30px rgba(0,45,114,0.04); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: var(--surface-2); color: var(--jotun-navy); font-weight: 600; padding: 16px 24px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 16px 24px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        
        .team-identity { font-weight: 600; color: var(--jotun-navy); font-size: 15px; }
        .token-tag { font-family: monospace; font-size: 12px; color: var(--text-muted); background: var(--surface); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
        
        .stage-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; background: #F1F5F9; color: #475569; }
        .stage-badge.done { background: rgba(16,185,129,0.1); color: var(--jotun-green); }
        
        .pile-preview-row { display: flex; gap: 3px; }
        .pile-preview-dot {
            width: 18px; height: 20px; border-radius: 3px; font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center;
            background: #E2E8F0; color: #94A3B8;
        }
        .pile-preview-dot.active { background: var(--jotun-navy); color: #FFFFFF; }
        .stage-badge.done + .pile-preview-row .pile-preview-dot { background: var(--jotun-green); color: white; }

        .progress-wrapper { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 220px; }
        .progress-track { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--jotun-navy); border-radius: 3px; transition: width 0.4s ease; }
        .progress-bar.complete { background: var(--jotun-green); }
        .progress-text { font-size: 12px; font-weight: 600; color: var(--text-muted); width: 36px; text-align: right; }
        .time-cell { font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-block">
                <div class="logo">J</div>
                <div>
                    <h1>Jotun Hunt 2026</h1>
                    <div class="subtitle">Live Administrative Console & Cohort Metrics</div>
                </div>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Registered Teams</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Hunts</div>
                <div class="stat-value" id="stat-active">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed Runs</div>
                <div class="stat-value" id="stat-done">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Mean Progress</div>
                <div class="stat-value" id="stat-avg">0%</div>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Team Identity</th>
                        <th>Current Phase</th>
                        <th>Fixed Pile Array Status</th>
                        <th>Completion Metric</th>
                        <th>Last Synchronization</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-rows">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsX-ExampLEKeySpAcE2026_Fix",
            authDomain: "jotunhunt2026.firebaseapp.com",
            projectId: "jotunhunt2026",
            databaseURL: "https://jotunhunt2026-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const TEAM_DATA_MAP = {
          "j7x2": "ROYAL BLUE", "m3kw": "MINTY BREEZE", "r9nt": "MOROCCAN MIST", "w4qb": "WOODSMOKE",
          "v6lp": "MEDITERRANEAN OLIVE", "t8cz": "TRAVERTINE CAIRO", "e2ys": "TIMELESS", "u5fh": "PURE OCEAN",
          "n1gd": "FOREVER JUNGLE", "d0rv": "DREAMY DESERT", "i4mo": "IVORY TOAST", "s6jt": "STONE GREY",
          "p2xn": "PASTEL MINT", "b9ae": "URBAN MIST", "q3wk": "PERSIAN PEARL", "f7cv": "DOVE GREY",
          "g5rl": "GOLDEN LILY", "h8uz": "EARTHSCAPE", "c1mb": "BRIGHT SIENNA", "k0yd": "MINIMALIST"
        };

        db.ref('gameData/teams').on('value', (snapshot) => {
            try {
                const liveData = snapshot.val() || {};
                const compilation = [];

                Object.entries(TEAM_DATA_MAP).forEach(([token, fallbackName]) => {
                    const record = liveData[token] || {};
                    const stage = record.currentStage || 1;
                    const isDone = record.isCompleted || false;
                    
                    let percentage = 0;
                    if (isDone) percentage = 100;
                    else if (stage > 1) percentage = Math.round(((stage - 1) / 7) * 100);

                    compilation.push({
                        token,
                        name: record.teamName || fallbackName,
                        stage,
                        isRegistered: !!record.teamName,
                        letters: record.letters || "_______",
                        isCompleted: isDone,
                        progressPct: percentage,
                        lastActive: record.lastActive || 0
                    });
                });

                compilation.sort((a, b) => b.progressPct - a.progressPct || b.lastActive - a.lastActive);
                updateGlobalAnalytics(compilation);

                const container = document.getElementById('leaderboard-rows');
                container.innerHTML = compilation.map(team => {
                    let phaseText = `Stage ${team.stage}/7`;
                    let badgeClass = '';
                    if (team.isCompleted) {
                        phaseText = "FINISHED";
                        badgeClass = "done";
                    } else if (team.stage === 1) {
                        phaseText = "UNREGISTERED";
                    } else if (team.stage === 7) {
                        phaseText = "FINALE ROUND";
                    }

                    const timeStr = team.lastActive ? new Date(team.lastActive).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '—';
                    const isDoneClass = team.isCompleted ? 'complete' : '';

                    // Fix 4: Output collection progress based on unified index keys array structure
                    let pileHtml = `<div class="pile-preview-row">`;
                    for(let i=0; i<7; i++) {
                        const char = team.letters[i] || "_";
                        if(char !== "_") {
                            pileHtml += `<div class="pile-preview-dot active">${char}</div>`;
                        } else {
                            pileHtml += `<div class="pile-preview-dot">_</div>`;
                        }
                    }
                    pileHtml += `</div>`;

                    return `
                        <tr>
                            <td>
                                <div class="team-identity">${team.name}</div>
                                <div style="margin-top:4px;"><span class="token-tag">${team.token}</span></div>
                            </td>
                            <td><span class="stage-badge ${badgeClass}">${phaseText}</span></td>
                            <td>${pileHtml}</td>
                            <td>
                                <div class="progress-wrapper">
                                    <div class="progress-track">
                                        <div class="progress-bar ${isDoneClass}" style="width: ${team.progressPct}%;"></div>
                                    </div>
                                    <div class="progress-text">${team.progressPct}%</div>
                                </div>
                            </td>
                            <td class="time-cell">${timeStr}</td>
                        </tr>`;
                }).join('');

            } catch (err) {
                console.error("Dashboard error:", err);
            }
        });

        function updateGlobalAnalytics(lineup) {
            const total = 20;
            const done = lineup.filter(t => t.isCompleted).length;
            const active = lineup.filter(t => t.isRegistered && !t.isCompleted).length;
            const totalSum = lineup.reduce((sum, t) => sum + t.progressPct, 0);
            const avgProgress = (totalSum / total).toFixed(0);

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-done').innerText = done;
            document.getElementById('stat-active').innerText = active;
            document.getElementById('stat-avg').innerText = `${avgProgress}%`;
        }
    </script>
</body>
</html>
