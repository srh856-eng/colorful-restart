<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun Hunts 2026 - Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Load the Firebase client library directly in frontend -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --navy:      #003087;
            --yellow:    #F5C400;
            --dark:      #0A1628;
            --surface:   rgba(255, 255, 255, 0.04);
            --border:    rgba(255, 255, 255, 0.08);
            --text:      #E8EDF5;
            --muted:     #8A9BBF;
            --red:       #E3001B;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container { width: 100%; max-width: 900px; }

        .title-panel { text-align: center; margin-bottom: 40px; }
        .title-text { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 3px; color: var(--yellow); }
        .subtitle { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 4px; text-transform: uppercase; margin-top: 4px;}

        .control-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 1.5px;
            color: var(--muted);
            padding: 14px;
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
        }
        td { padding: 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 14px; vertical-align: middle;}

        .team-display-name { font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .team-token-label { font-size: 11px; color: var(--muted); font-family: monospace; }

        .badge-stage {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 48, 135, 0.3);
            border: 1px solid rgba(0, 48, 135, 0.6);
            color: #afc9ff;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
        }

        .progress-track-wrapper { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 260px; }
        .progress-bar-outer { flex-grow: 1; height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; position: relative;}
        .progress-bar-inner { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--red)); width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .progress-text { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--yellow); width: 65px; text-align: right;}

        .timestamp-label { font-size: 12px; color: var(--muted); }

        .empty-row { text-align: center; color: var(--muted); padding: 40px 0; font-style: italic; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="title-panel">
        <div class="title-text">JOTUN WAR ROOM</div>
        <div class="subtitle">Live Scavenger Tracking Metrics</div>
    </div>

    <div class="control-card">
        <table>
            <thead>
                <tr>
                    <th>Assigned Team Name</th>
                    <th>Current Station</th>
                    <th>Hunt Completion Progress</th>
                    <th>Last Active Signature</th>
                </tr>
            </thead>
            <tbody id="leaderboard-rows">
                <tr>
                    <td colspan="4" class="empty-row">Establishing downstream data synchronization...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ⚙️ REPLACE THIS CONFIG WITH YOUR EXACT FIREBASE PROJECT PROPERTIES
    const firebaseConfig = {
        databaseURL: "https://jotunhunt2026-default-rtdb.firebaseio.com" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Dynamically listen to live value changes stream in Firebase Realtime Database
    db.ref('teams').on('value', (snapshot) => {
        const rowsContainer = document.getElementById('leaderboard-rows');
        rowsContainer.innerHTML = '';

        const data = snapshot.val();

        if (!data) {
            rowsContainer.innerHTML = `<tr><td colspan="4" class="empty-row">No teams registered. Waiting for teams to enter their name details.</td></tr>`;
            return;
        }

        // Parse and sort teams based on their activity timestamp
        const recordsList = Object.keys(data).map(key => ({
            token: key,
            ...data[key]
        })).sort((a, b) => (b.lastActive || 0) - (a.lastActive || 0));

        recordsList.forEach(team => {
            const tr = document.createElement('tr');

            // Render safe format fallback patterns if metrics arrive incomplete initially
            const displayName = team.teamName ? team.teamName : "INITIALIZING IDENTITY...";
            const currentStage = team.stage ? team.stage : "1";
            const rawProgress = team.progress ? team.progress : "20%";
            const numericPercent = parseInt(rawProgress) || 20;

            // Generate clean human-readable relative time string loops
            let activityString = "Just now";
            if (team.lastActive) {
                const diffSeconds = Math.floor((Date.now() - team.lastActive) / 1000);
                if (diffSeconds > 60) {
                    const diffMinutes = Math.floor(diffSeconds / 60);
                    activityString = `${diffMinutes}m ago`;
                } else if (diffSeconds > 5) {
                    activityString = `${diffSeconds}s ago`;
                }
            }

            tr.innerHTML = `
                <td>
                    <div class="team-display-name">${displayName}</div>
                    <div class="team-token-label">Access ID: ${team.token}</div>
                </td>
                <td>
                    <span class="badge-stage">Stage ${currentStage}</span>
                </td>
                <td>
                    <div class="progress-track-wrapper">
                        <div class="progress-bar-outer">
                            <div class="progress-bar-inner" style="width: ${numericPercent}%"></div>
                        </div>
                        <div class="progress-text">${rawProgress}</div>
                    </div>
                </td>
                <td>
                    <span class="timestamp-label">${activityString}</span>
                </td>
            `;

            rowsContainer.appendChild(tr);
        });
    });
</script>

</body>
</html>
